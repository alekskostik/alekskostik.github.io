<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1410">
<title>Фаня в лесу</title>
<style>
/* =============================================================================
 * styles.css — the shell around the canvas.
 *
 * Palette is pulled from the game's own world: bark, moss, low sun, bone. The
 * UI sits on dark bark panels so it never competes with the path for attention.
 * ========================================================================== */

:root {
  --bark:      #16241b;
  --bark-deep: #0a1410;
  --moss:      #7fc46a;
  --sun:       #f2b544;
  --bone:      #f4ead6;
  --bone-dim:  rgba(244, 234, 214, 0.62);

  --font-display: "Avenir Next Condensed", "Futura", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Avenir Next", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(120% 90% at 50% 8%, #16281f 0%, var(--bark-deep) 62%, #050b08 100%);
  font-family: var(--font-ui);
  color: var(--bone);
  /* A runner must own every gesture: no scroll, no pinch, no pull-to-refresh,
     no long-press callout, no double-tap zoom. */
  touch-action: none;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

/* --------------------------------------------------------------- the stage */
#stage {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 390px;
  height: 844px;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  overflow: hidden;
  border-radius: 22px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
  background: var(--bark-deep);
}

#game {
  display: block;
  width: 390px;
  height: 844px;
  touch-action: none;
}

/* ------------------------------------------------------------------ menus */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 26px;
  background: linear-gradient(180deg, rgba(6, 14, 10, 0.62), rgba(6, 14, 10, 0.9));
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

.overlay.hidden,
#loading.hidden { display: none; }

.card {
  width: 100%;
  padding: 26px 22px 22px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(28, 46, 34, 0.96), rgba(16, 28, 21, 0.96));
  border: 1px solid rgba(244, 234, 214, 0.12);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
  text-align: left;
}

.eyebrow {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--sun);
}

.card h1 {
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-size: 36px;
  line-height: 1.02;
  letter-spacing: -0.01em;
  font-weight: 700;
}

.card .body {
  margin: 0 0 16px;
  font-size: 14px;
  line-height: 1.45;
  color: var(--bone-dim);
}

#ov-stats { margin-bottom: 18px; }

.stat {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid rgba(244, 234, 214, 0.09);
  font-size: 13px;
}

.stat:last-child { border-bottom: none; }
.stat span { color: var(--bone-dim); }
.stat b { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.01em; }

.actions { display: flex; flex-direction: column; gap: 9px; }

.btn {
  appearance: none;
  width: 100%;
  padding: 14px 16px;
  border-radius: 13px;
  border: 1px solid rgba(244, 234, 214, 0.16);
  background: rgba(244, 234, 214, 0.07);
  color: var(--bone);
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: transform 0.09s ease, background 0.15s ease;
}

.btn:hover { background: rgba(244, 234, 214, 0.13); }
.btn:active { transform: scale(0.985); }

.btn-primary {
  background: linear-gradient(180deg, var(--sun), #d99a2b);
  border-color: rgba(0, 0, 0, 0.2);
  color: #21160a;
  font-weight: 700;
}

.btn-primary:hover { background: linear-gradient(180deg, #ffc659, #e0a230); }

.btn:focus-visible,
.tbtn:focus-visible,
.sysbtn:focus-visible {
  outline: 2px solid var(--moss);
  outline-offset: 2px;
}

/* ------------------------------------------------------------ thumb pads */
#touch-controls {
  position: absolute;
  inset: 0;
  pointer-events: none;   /* only the buttons themselves take input */
}

.pad { position: absolute; display: flex; align-items: flex-end; gap: 10px; }
.pad-left { left: 16px; bottom: 26px; }
.pad-right { right: 16px; bottom: 26px; flex-direction: column; align-items: flex-end; }

.tbtn {
  pointer-events: auto;
  width: 66px;
  height: 66px;
  padding: 0;
  border-radius: 22px;
  border: 1px solid rgba(244, 234, 214, 0.16);
  background: rgba(12, 24, 17, 0.42);
  color: var(--bone);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  cursor: pointer;
  transition: background 0.1s ease, transform 0.08s ease;
}

.tbtn svg { width: 30px; height: 30px; fill: currentColor; }
.tbtn.pressed { background: rgba(127, 196, 106, 0.34); transform: scale(0.94); }

.tbtn-small { width: 54px; height: 54px; border-radius: 18px; opacity: 0.9; }
.tbtn-small svg { width: 24px; height: 24px; }
.tbtn-jump { width: 78px; height: 78px; border-radius: 26px; }
.tbtn-jump svg { width: 34px; height: 34px; }

/* -------------------------------------------------------- pause and sound */
#system-buttons {
  position: absolute;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sysbtn {
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid rgba(244, 234, 214, 0.14);
  background: rgba(12, 24, 17, 0.42);
  color: var(--bone-dim);
  cursor: pointer;
}

.sysbtn svg { width: 20px; height: 20px; fill: currentColor; }
.sysbtn:active { transform: scale(0.94); }
.sysbtn .cross { display: none; }
.sysbtn.off .wave { display: none; }
.sysbtn.off .cross { display: block; }

/* ----------------------------------------------------------------- loading */
#loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.06em;
  color: var(--bone-dim);
  background: var(--bark-deep);
}

@media (prefers-reduced-motion: reduce) {
  .btn, .tbtn, .sysbtn { transition: none; }
}

/* ------------------------------------------------------- leaderboard */
.namerow { display: flex; gap: 8px; margin-bottom: 8px; }

.nameinput {
  flex: 1 1 auto;
  min-width: 0;
  padding: 12px 13px;
  border-radius: 12px;
  border: 1px solid rgba(244, 234, 214, 0.18);
  background: rgba(10, 20, 14, 0.55);
  color: var(--bone);
  font-family: var(--font-ui);
  font-size: 15px;               /* 16px or above stops iOS zooming on focus */
}

.nameinput::placeholder { color: rgba(244, 234, 214, 0.38); }
.nameinput:focus { outline: 2px solid var(--moss); outline-offset: 1px; }

.btn-send { width: auto; flex: 0 0 auto; padding: 12px 15px; font-size: 14px; }
.btn-send:disabled { opacity: 0.55; cursor: default; }

.note { margin: 0 0 10px; font-size: 12px; line-height: 1.35; color: var(--sun); }

.board-title {
  margin: 14px 0 6px;
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--bone-dim);
}

.board {
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--bone-dim);
  max-height: 168px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.board-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(244, 234, 214, 0.07);
}

.board-row:last-child { border-bottom: none; }
.board-row .rank { width: 22px; color: rgba(244, 234, 214, 0.4); font-variant-numeric: tabular-nums; }
.board-row .who {
  flex: 1 1 auto;
  color: var(--bone);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;           /* a long name must not break the layout */
}
.board-row b { font-family: var(--font-display); color: var(--sun); font-variant-numeric: tabular-nums; }

</style>
</head>
<body>

<!-- The stage is a fixed 390x844 box (iPhone 12-17 logical viewport). It is
     uniformly scaled by main.js to fit whatever window it lands in, so the
     desktop build frames the action exactly like the phone build. -->
<div id="stage">
  <canvas id="game" width="390" height="844"></canvas>

  <!-- ---------------------------------------------------- menus / results -->
  <div id="overlay" class="overlay hidden">
    <div class="card">
      <p class="eyebrow" id="ov-eyebrow"></p>
      <h1 id="ov-title"></h1>
      <p class="body" id="ov-body"></p>
      <div id="ov-stats"></div>
      <div id="ov-submit"></div>
      <div id="ov-board"></div>
      <div class="actions" id="ov-actions"></div>
    </div>
  </div>

  <!-- ------------------------------------------------ optional thumb pads -->
  <div id="touch-controls">
    <div class="pad pad-left">
      <button class="tbtn" data-action="left" aria-label="Влево">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20 Z"/></svg>
      </button>
      <button class="tbtn" data-action="right" aria-label="Вправо">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20 Z"/></svg>
      </button>
    </div>
    <div class="pad pad-right">
      <button class="tbtn tbtn-small" data-action="slide" aria-label="Подкат">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9 L12 16 L19 9" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="18" width="16" height="2.6" rx="1.3"/></svg>
      </button>
      <button class="tbtn tbtn-jump" data-action="jump" aria-label="Прыжок">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 14 L12 7 L19 14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="18" width="16" height="2.6" rx="1.3"/></svg>
      </button>
    </div>
  </div>

  <!-- ------------------------------------------------------ pause / sound -->
  <div id="system-buttons">
    <button id="btn-pause" class="sysbtn" aria-label="Пауза">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="4" height="14" rx="1.4"/><rect x="13" y="5" width="4" height="14" rx="1.4"/></svg>
    </button>
    <button id="btn-mute" class="sysbtn" aria-label="Выключить звук">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 h4 l5 -4 v14 l-5 -4 H4 Z"/><path class="wave" d="M16 9.5 a4 4 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16.5 9.5 L21 14.5 M21 9.5 L16.5 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="loading">Лес просыпается…</div>
</div>

<!-- Load order matters: each module reads the ones above it at define time.
     Plain scripts (not ES modules) so the game also runs from a file:// URL
     with no server and no build step. -->
<script>
/* ===== src/config.js ================================================= */
/* =============================================================================
 * config.js — ALL tunable numbers live here. No balance value is hardcoded
 * anywhere else in the codebase. To re-balance the game, edit only this file.
 *
 * Unit system
 *   world units : arbitrary 3D units; road.halfWidth is the reference scale
 *   z           : distance along the track, in world units
 *   offset      : lateral position in multiples of road.halfWidth, so
 *                 -1 = left edge of the path, 0 = centre, +1 = right edge
 *   meters      : cosmetic distance for score, = z / score.unitsPerMeter
 * ========================================================================== */
(function (FA) {
  'use strict';

  FA.CONFIG = {
    /* ---------------------------------------------------------------- view */
    view: {
      // iPhone 12/13/14 logical viewport. 15/16/17 are 393x852 — close enough
      // that we letterbox instead of reflowing. The stage is uniformly scaled
      // to fit any window, so desktop gets the exact mobile framing.
      designWidth: 390,
      designHeight: 844,
      maxDeltaMs: 250,       // clamp after a tab switch or breakpoint stall
      fixedStep: 1 / 60,     // deterministic physics tick
      maxSubSteps: 5,        // catch-up ceiling (prevents the spiral of death)
      pixelRatioCap: 2       // don't render at 3x on Pro models — costs FPS
    },

    /* -------------------------------------------------------------- camera */
    camera: {
      height: 1800,          // eye height above the path
      backZ: 900,            // how far behind the cat the camera sits
      fieldOfView: 100,      // degrees
      horizonRatio: 0.40,    // horizon line as a fraction of screen height
      drawDistance: 180,     // segments rendered per frame
      fogDensity: 4.2,       // higher = thicker forest haze
      lateralFollow: 0.34,   // 0 = camera locked to centre, 1 = glued to cat
      lateralLag: 6.0        // camera pan smoothing (higher = snappier)
    },

    /* ---------------------------------------------------------------- road */
    road: {
      segmentLength: 200,
      halfWidth: 1200,
      rumbleLength: 4,       // segments per colour band
      totalSegments: 1200,   // the track is a ring; ~40 s per lap at base speed
      curve: {               // the path is never straight for long
        gentle: 1.6,
        medium: 3.4,
        sharp: 5.2,
        straightRun: [14, 40],   // segments [min, max]
        curveRun: [50, 130],
        hillHeight: 260,
        hillChance: 0.55
      },
      colors: {
        light: { road: '#8a6a45', grass: '#2f5a33', rumble: '#c8a86a' },
        dark:  { road: '#7d5f3d', grass: '#28502d', rumble: '#a98b52' }
      }
    },

    /* -------------------------------------------------------------- player */
    player: {
      laneOffsets: [-0.62, 0, 0.62],
      startLane: 1,
      laneChangeSpeed: 4.2,      // offset units/sec (~0.3 s per lane)
      jumpVelocity: 2600,        // world units/sec  -> apex ~600
      gravity: 5600,             // world units/sec^2 -> airtime ~0.93 s
      fastFallMultiplier: 2.4,   // slide input while airborne = slam down
      standHeight: 560,          // hitbox height while running
      slideHeight: 220,          // hitbox height while sliding
      slideDuration: 0.62,
      slideCooldown: 0.12,
      hitboxHalfWidth: 0.16,     // narrower than the sprite = forgiving
      maxHP: 3,
      invulnerableAfterHit: 1.5, // i-frames + blink
      hitSlowdown: 0.45,         // speed multiplier applied on impact
      hitRecoverTime: 0.9
    },

    /* --------------------------------------------------------------- speed */
    speed: {
      base: 4800,                // world units/sec at level 1
      levelStep: 0.10,           // +10% per level
      maxMultiplier: 1.9,
      rampUpTime: 1.2            // ease-in at level start
    },

    /* --------------------------------------------------------------- level */
    level: {
      durationSec: 90,          // "you run out of the forest" after this
      count: 5,
      introSec: 1.6,             // banner before the level clock starts
      heartsRestoredOnClear: 1   // small mercy between levels
    },

    /* --------------------------------------------------------------- score */
    score: {
      unitsPerMeter: 250,
      perMeter: 1,
      pickup: { mushroom: 25, berry: 15, shrimp: 60 },
      npcDeactivated: 120,
      levelCompleteBonus: 500,
      hpBonusPerHeart: 150,
      comboStep: 0.1,            // +10% per pickup in a chain
      comboMax: 3.0,
      comboWindowSec: 2.0
    },

    /* --------------------------------------------------------------- spawn */
    spawn: {
      startSafeSegments: 90,     // grace zone at the start of a level
      lookaheadSegments: 300,    // populate this far ahead (beyond draw range)
      minGapSegments: 22,
      gapJitter: 16,
      difficultyRamp: 0.35,      // how much the level number tightens spacing
      sceneryEvery: 3,
      sceneryDensity: 0.85,
      patternWeights: {
        singleObstacle: 24,
        doubleObstacle: 12,
        lowBranch: 10,
        pickupLine: 32,
        pickupArc: 20,
        npc: 22
      }
    },

    /* ----------------------------------------------------- entity catalogue
     * avoid : 'jump'  — clear it by jumping
     *         'slide' — duck under it
     *         'lane'  — too tall to jump, must change lane
     * yBase : bottom of the hitbox above the path, in world units
     * height: hitbox height (independent of the drawn sprite size)
     */
    obstacles: {
      rock:   { sprite: 'rock',   avoid: 'jump',  halfWidth: 0.18, yBase: 0,   height: 300, worldW: 420,  worldH: 340 },
      log:    { sprite: 'log',    avoid: 'jump',  halfWidth: 0.30, yBase: 0,   height: 240, worldW: 760,  worldH: 280 },
      branch: { sprite: 'branch', avoid: 'slide', halfWidth: 0.52, yBase: 380, height: 420, worldW: 1250, worldH: 520 },
      stump:  { sprite: 'stump',  avoid: 'jump',  halfWidth: 0.20, yBase: 0,   height: 300, worldW: 460,  worldH: 380 },
      bush:   { sprite: 'bush',   avoid: 'jump',  halfWidth: 0.24, yBase: 0,   height: 320, worldW: 620,  worldH: 400 }
    },

    pickups: {
      mushroom: { sprite: 'mushroom', halfWidth: 0.30, yBase: 40,  height: 340, worldW: 400, worldH: 400 },
      berry:    { sprite: 'berry',    halfWidth: 0.30, yBase: 40,  height: 320, worldW: 380, worldH: 380 },
      shrimp:   { sprite: 'shrimp',   halfWidth: 0.30, yBase: 300, height: 320, worldW: 460, worldH: 380 }
    },

    /* ----------------------------------------------------------------- NPC */
    /* A slow brightness pulse on obstacles, ramping in as they approach, so
     * the thing you must react to separates itself from the scenery. Kept
     * deliberately low-amplitude: a cue, not a strobe. enabled:false removes
     * it entirely. */
    obstacleCue: {
      enabled: true,
      nearSegments: 45,        // start pulsing once this close
      amplitude: 0.34,         // peak overlay alpha at closest approach
      speedHz: 1.6,            // pulses per second
      color: '255,244,214',    // warm bone; matches the low sun
      darkColor: '18,26,20',   // the down half of the pulse
      darkFactor: 0.7          // the dark swing is gentler than the bright one
    },

    /* A warning badge above an obstacle while it is still far off, fading out
     * as it approaches — the long-range half of the readability system. It
     * hands over to obstacleCue at fadeBySegments, so there is always exactly
     * one cue running: badge far, pulse near. */
    obstacleMarker: {
      enabled: true,
      fromSegments: 140,       // first appears, faint
      peakSegments: 34,        // fully bright — the moment you must react
      hideBySegments: 11,      // gone; by now the obstacle speaks for itself
      sizePx: 10,              // screen size when far (FIXED, not projected,
                               // so distance never shrinks it below legibility)
      sizePxNear: 17,          // screen size at peak — grows as it approaches
      gapPx: 8,                // clearance above the sprite
      bobPx: 3,
      bobHz: 2.2,
      color: '#ffcf6a',
      ink: '#241a08',
      minFog: 0.88,            // ignore most of the fog, or it is unreadable
      onHazards: true          // flag dropped hazards the same way
    },

    npc: {
      types: {
        bear:     { sprite: 'bear',     worldW: 900, worldH: 950,  drops: ['honey', 'rock_small'], dropIntervalSec: [1.4, 2.2], tapsToStop: 1 },
        moose:    { sprite: 'moose',    worldW: 980, worldH: 1080, drops: ['rock_small'],          dropIntervalSec: [1.7, 2.6], tapsToStop: 1 },
        squirrel: { sprite: 'squirrel', worldW: 500, worldH: 540,  drops: ['slime', 'rock_small'], dropIntervalSec: [1.1, 1.8], tapsToStop: 1 }
      },
      sideOffsets: [-1.25, 1.25],      // which verge an animal walks in from
      crossRange: 1.15,                // how far across the path they wander
      crossSpeed: [0.34, 0.62],        // lateral speed, in offset units/sec
      dropFromOwnLane: true,           // drop into the lane they are standing in
      activeRangeSegments: [40, 170],  // they only throw inside this window
      dropLeadSegments: [30, 70],      // hazards land this far in front of them
      tapPaddingPx: 26,                // finger-friendly padding on the tap box
      tapCooldownSec: 0.10,            // one press must not register as three
      hitFlashSec: 0.18,
      deactivateFadeSec: 0.9
    },

    /* ------------------------------------------------------------- hazards */
    hazards: {
      rock_small: { sprite: 'rock_small', avoid: 'jump', halfWidth: 0.17, yBase: 0, height: 260, worldW: 340, worldH: 300, lifeSec: 9 },
      slime:      { sprite: 'slime',      avoid: 'jump', halfWidth: 0.22, yBase: 0, height: 170, worldW: 430, worldH: 200, lifeSec: 9 },
      honey:      { sprite: 'honey',      avoid: 'lane', halfWidth: 0.20, yBase: 0, height: 900, worldW: 380, worldH: 430, lifeSec: 9 }
    },
    hazardDrop: {
      startHeight: 2200,
      gravity: 4200,
      spinRate: 5.0,
      splashSec: 0.25
    },

    /* --------------------------------------------------------------- input */
    input: {
      swipeMinPx: 26,            // travel before a touch counts as a swipe
      swipeMaxTimeMs: 600,
      tapMaxPx: 18,              // movement budget for a touch to stay a tap
      tapMaxTimeMs: 260,
      jumpBufferSec: 0.14,       // a press just before landing still jumps
      doubleTapSlide: false,     // true = double-tap slides (adds tap latency)
      doubleTapMs: 240,
      showTouchButtons: 'auto'   // 'auto' | true | false
    },

    /* --------------------------------------------------------------- audio */
    audio: { enabled: true, masterVolume: 0.32 },

    /* -------------------------------------------------------------- assets */
    assets: {
      // Flip to true once real PNGs are in ./assets/ (see ASSETS_SPEC.md).
      // While false, the game runs entirely on procedural placeholders.
      useExternal: false,
      basePath: 'assets/',
      // Frame counts and sizes are the contract for external art. The
      // placeholder generator emits sheets with exactly this layout.
      manifest: {
        cat_run:    { file: 'cat_run.png',    frameW: 96,  frameH: 96,  frames: 6, fps: 16 },
        cat_jump:   { file: 'cat_jump.png',   frameW: 96,  frameH: 96,  frames: 2, fps: 6 },
        cat_slide:  { file: 'cat_slide.png',  frameW: 96,  frameH: 64,  frames: 2, fps: 8 },
        cat_hit:    { file: 'cat_hit.png',    frameW: 96,  frameH: 96,  frames: 1 },
        rock:       { file: 'rock.png',       frameW: 64,  frameH: 64,  frames: 1 },
        rock_small: { file: 'rock_small.png', frameW: 48,  frameH: 48,  frames: 1 },
        log:        { file: 'log.png',        frameW: 128, frameH: 48,  frames: 1 },
        branch:     { file: 'branch.png',     frameW: 192, frameH: 80,  frames: 1 },

(function (FA) {
  'use strict';

  var CONFIG = FA.CONFIG;
  var IN = CONFIG.input;

  var handlers = { action: null, tap: null, pause: null };
  var canvas = null;
  var pointers = {};
  var lastTapTime = 0;
  var pendingTap = null;      // only used when doubleTapSlide is enabled
  var enabled = true;

  function toDesign(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    // The rect already reflects the CSS transform, so this is scale-agnostic.
    return {
      x: (clientX - r.left) / r.width * CONFIG.view.designWidth,
      y: (clientY - r.top) / r.height * CONFIG.view.designHeight
    };
  }

  function emit(kind) {
    if (enabled && handlers.action) handlers.action(kind);
  }

  /** A tap that hits no animal still counts as a jump. */
  function resolveTap(clientX, clientY) {
    var p = toDesign(clientX, clientY);

    if (IN.doubleTapSlide) {
      var now = performance.now();
      if (now - lastTapTime < IN.doubleTapMs) {
        clearTimeout(pendingTap);
        pendingTap = null;
        lastTapTime = 0;
        emit('slide');
        return;
      }
      lastTapTime = now;
      // Hitting an animal is resolved immediately; only the jump waits to see
      // whether a second tap arrives.
      if (handlers.tap && handlers.tap(p.x, p.y)) { lastTapTime = 0; return; }
      pendingTap = setTimeout(function () {
        pendingTap = null;
        emit('jump');
      }, IN.doubleTapMs);
      return;
    }

    if (!(handlers.tap && handlers.tap(p.x, p.y))) emit('jump');
  }

  function start(id, x, y) {
    pointers[id] = { x0: x, y0: y, t0: performance.now(), fired: false };
  }

  function move(id, x, y) {
    var g = pointers[id];
    if (!g || g.fired) return;
    var dx = x - g.x0, dy = y - g.y0;
    if (Math.sqrt(dx * dx + dy * dy) < IN.swipeMinPx) return;
    g.fired = true;                                   // one verb per gesture
    if (performance.now() - g.t0 > IN.swipeMaxTimeMs) return;   // too slow: a drag
    if (Math.abs(dx) > Math.abs(dy)) emit(dx > 0 ? 'right' : 'left');
    else emit(dy > 0 ? 'slide' : 'jump');
  }

  function end(id, x, y) {
    var g = pointers[id];
    delete pointers[id];
    if (!g || g.fired) return;
    var dx = x - g.x0, dy = y - g.y0;
    if (Math.sqrt(dx * dx + dy * dy) <= IN.tapMaxPx &&
        performance.now() - g.t0 <= IN.tapMaxTimeMs) {
      resolveTap(x, y);
    }
  }

  var KEYS = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
    ArrowDown: 'slide', KeyS: 'slide'
  };

  FA.Input = {
    init: function (canvasEl, hooks) {
      canvas = canvasEl;
      handlers = hooks;
      var i, t;

      // ---- touch. passive:false so scroll / pull-to-refresh can be blocked.
      canvas.addEventListener('touchstart', function (e) {
        e.preventDefault();
        for (i = 0; i < e.changedTouches.length; i++) {
          t = e.changedTouches[i];
          start(t.identifier, t.clientX, t.clientY);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', function (e) {
        e.preventDefault();
        for (i = 0; i < e.changedTouches.length; i++) {
          t = e.changedTouches[i];
          move(t.identifier, t.clientX, t.clientY);
        }
      }, { passive: false });

      canvas.addEventListener('touchend', function (e) {
        e.preventDefault();
        for (i = 0; i < e.changedTouches.length; i++) {
          t = e.changedTouches[i];
          end(t.identifier, t.clientX, t.clientY);
        }
      }, { passive: false });

      canvas.addEventListener('touchcancel', function (e) {
        for (i = 0; i < e.changedTouches.length; i++) delete pointers[e.changedTouches[i].identifier];
      }, { passive: false });

      // ---- mouse: desktop parity (click = tap, drag = swipe)
      var mouseDown = false;
      canvas.addEventListener('mousedown', function (e) {
        mouseDown = true;
        start('mouse', e.clientX, e.clientY);
      });
      window.addEventListener('mousemove', function (e) {
        if (mouseDown) move('mouse', e.clientX, e.clientY);
      });
      window.addEventListener('mouseup', function (e) {
        if (!mouseDown) return;
        mouseDown = false;
        end('mouse', e.clientX, e.clientY);
      });
      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      // ---- keyboard
      window.addEventListener('keydown', function (e) {
        if (e.repeat) return;                    // a held key must not machine-gun
        if (e.code === 'Escape' || e.code === 'KeyP') {
          e.preventDefault();
          if (handlers.pause) handlers.pause();
          return;
        }
        var action = KEYS[e.code];
        if (!action) return;
        e.preventDefault();                      // Space must not scroll the page
        emit(action);
      });
    },

    /** On-screen buttons and menus route through here. */
    emit: emit,
    toDesign: toDesign,

    setEnabled: function (v) {
      enabled = v;
      if (!v) pointers = {};
    },

    /** Drop in-flight gestures when the game state changes underfoot. */
    clear: function () {
      pointers = {};
      clearTimeout(pendingTap);
      pendingTap = null;
    }
  };
})(window.FA = window.FA || {});

/* ===== src/audio.js ================================================== */
/* =============================================================================
 * audio.js — synthesised SFX. No audio files to ship, nothing to preload.
 *
 * Browsers only allow audio after a user gesture, so the context is created
 * lazily on first use and resumed defensively before every sound.
 * ========================================================================== */
(function (FA) {
  'use strict';

  var CONFIG = FA.CONFIG;
  var ctx = null;
  var muted = false;

  function ensure() {
    if (!CONFIG.audio.enabled || muted) return null;
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /** One shaped oscillator note. */
  function blip(freq, endFreq, duration, type, gain) {
    var ac = ensure();
    if (!ac) return;
    var osc = ac.createOscillator();
    var amp = ac.createGain();
    var t0 = ac.currentTime;
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (endFreq && endFreq !== freq) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), t0 + duration);
    }
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime((gain || 1) * CONFIG.audio.masterVolume, t0 + 0.012);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(amp).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function sequence(notes) {
    if (!ensure()) return;
    notes.forEach(function (n, i) {
      setTimeout(function () { blip(n[0], n[1], n[2], n[3], n[4]); }, i * 90);
    });
  }

  FA.Audio = {
    unlock: function () { ensure(); },
    toggleMute: function () { muted = !muted; return muted; },
    isMuted: function () { return muted; },

    jump:       function () { blip(420, 780, 0.14, 'square', 0.5); },
    slide:      function () { blip(300, 140, 0.20, 'sawtooth', 0.35); },
    pickup:     function (step) { blip(660 + (step || 0) * 55, 1180 + (step || 0) * 55, 0.12, 'triangle', 0.6); },
    hit:        function () { blip(200, 60, 0.34, 'sawtooth', 0.8); },
    npcHit:     function () { blip(520, 380, 0.09, 'square', 0.5); },
    npcDown:    function () { sequence([[500, 700, 0.10, 'square', 0.6], [700, 980, 0.16, 'triangle', 0.6]]); },
    levelClear: function () { sequence([[523, 523, 0.14, 'triangle', 0.7], [659, 659, 0.14, 'triangle', 0.7], [784, 784, 0.14, 'triangle', 0.7], [1047, 1047, 0.30, 'triangle', 0.7]]); },
    gameOver:   function () { sequence([[440, 440, 0.18, 'square', 0.6], [349, 349, 0.18, 'square', 0.6], [262, 180, 0.45, 'sawtooth', 0.6]]); }
  };
})(window.FA = window.FA || {});

/* ===== src/fx.js ===================================================== */
/* =============================================================================
 * fx.js — screen-space particles and floating score popups.
 *
 * Deliberately screen-space rather than world-space: these are feedback for
 * the player, not objects in the forest, and they cost nothing to place. Both
 * pools are pre-allocated ring buffers, so the hot loop allocates nothing and
 * the GC never runs mid-run.
 * ========================================================================== */
(function (FA) {
  'use strict';

  var MAX_PARTICLES = 160;
  var MAX_TEXTS = 24;

  function makePool(n, factory) {
    var a = new Array(n);
    for (var i = 0; i < n; i++) a[i] = factory();
    return a;
  }

  FA.FX = {
    create: function () {
      return {
        particles: makePool(MAX_PARTICLES, function () {
          return { alive: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 3, color: '#fff', gravity: 0 };
        }),
        texts: makePool(MAX_TEXTS, function () {
          return { alive: false, x: 0, y: 0, vy: 0, life: 0, maxLife: 1, text: '', color: '#fff', size: 16 };
        }),
        pi: 0,
        ti: 0
      };
    },

    burst: function (fx, x, y, count, color, opts) {
      opts = opts || {};
      var spread = opts.spread || 140;
      var size = opts.size || 3;
      var life = opts.life || 0.5;
      for (var i = 0; i < count; i++) {
        var p = fx.particles[fx.pi];
        fx.pi = (fx.pi + 1) % fx.particles.length;      // oldest gets recycled
        var a = Math.random() * Math.PI * 2;
        var sp = spread * (0.35 + Math.random() * 0.65);
        p.alive = true;
        p.x = x; p.y = y;
        p.vx = Math.cos(a) * sp;
        p.vy = Math.sin(a) * sp - (opts.lift || 40);
        p.life = p.maxLife = life * (0.6 + Math.random() * 0.6);
        p.size = size * (0.6 + Math.random() * 0.8);
        p.color = color;
        p.gravity = opts.gravity === undefined ? 320 : opts.gravity;
      }
    },

    text: function (fx, x, y, text, color, size) {
      var t = fx.texts[fx.ti];
      fx.ti = (fx.ti + 1) % fx.texts.length;
      t.alive = true;
      t.x = x; t.y = y;
      t.vy = -46;
      t.life = t.maxLife = 0.9;
      t.text = text;
      t.color = color || '#ffe9a8';
      t.size = size || 15;
    },

    update: function (fx, dt) {
      var i, p, t;
      for (i = 0; i < fx.particles.length; i++) {
        p = fx.particles[i];
        if (!p.alive) continue;
        p.life -= dt;
        if (p.life <= 0) { p.alive = false; continue; }
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      for (i = 0; i < fx.texts.length; i++) {
        t = fx.texts[i];
        if (!t.alive) continue;
        t.life -= dt;
        if (t.life <= 0) { t.alive = false; continue; }
        t.y += t.vy * dt;
        t.vy *= 0.94;
      }
    },

    render: function (ctx, fx) {
      var i, p, t, a;
      ctx.save();
      for (i = 0; i < fx.particles.length; i++) {
        p = fx.particles[i];
        if (!p.alive) continue;
        a = p.life / p.maxLife;
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center';
      for (i = 0; i < fx.texts.length; i++) {
        t = fx.texts[i];
        if (!t.alive) continue;
        a = Math.min(1, t.life / t.maxLife * 1.6);
        ctx.globalAlpha = a;
        ctx.font = '700 ' + t.size + 'px ' + FA.FONT_UI;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(20,26,18,0.75)';
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
      }
      ctx.restore();
    }
  };
})(window.FA = window.FA || {});

/* ===== src/renderer.js =============================================== */
/* =============================================================================
 * renderer.js — draws one frame.
 *
 * Pipeline per frame:
 *   1. sky + parallax tree bands           (cheap, cached offscreen strips)
 *   2. road segments, near to far, with a running `maxy` clip so distant
 *      segments never paint over closer ones
 *   3. sprites, far to near (painter's algorithm), clipped to their segment
 *   4. the cat
 *   5. fog / canopy vignette
 *
 * The renderer is read-only with respect to game state, with one exception:
 * it stamps `screenBox` onto NPCs so the tap handler knows where they are on
 * screen. That's deliberate — screen bounds only exist once you've projected.
 * ========================================================================== */
(function (FA) {
  'use strict';

  var CONFIG = FA.CONFIG;
  var U = FA.Utils;
  var Track = FA.Track;
  var Assets = FA.Assets;

  var W = CONFIG.view.designWidth;
  var H = CONFIG.view.designHeight;
  var UNIT = W / 2;                 // isotropic projection unit
  var HORIZON = Math.round(H * CONFIG.camera.horizonRatio);

  var FOG_COLOR = [26, 46, 34];     // deep forest haze
  var strips = null;
  var skyGradient = null;

  /* ------------------------------------------------------- offscreen strips */
  function buildStrip(width, height, colors, spikes, jitterSeed) {
    var c = document.createElement('canvas');
    c.width = width; c.height = height;
    var ctx = c.getContext('2d');
    var rng = U.createRNG(jitterSeed);
    // Repeating conifer skyline. Drawn twice as wide as the screen so a single
    // tile plus its neighbour always covers the viewport at any offset.
    for (var layer = 0; layer < colors.length; layer++) {
      ctx.fillStyle = colors[layer];
      ctx.beginPath();
      ctx.moveTo(0, height);
      var step = width / spikes;
      for (var i = 0; i <= spikes; i++) {
        var x = i * step;
        var peak = height * (0.15 + rng.next() * 0.55) + layer * height * 0.18;
        ctx.lineTo(x - step * 0.42, height);
        ctx.lineTo(x, peak);
        ctx.lineTo(x + step * 0.42, height);
      }
      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.fill();
    }
    return c;
  }

  function ensureAssets(ctx) {
    if (strips) return;
    strips = {
      far: buildStrip(W * 2, 96, ['#20402c', '#1a3626'], 26, 7331),
      near: buildStrip(W * 2, 150, ['#1b3a28', '#14301f'], 14, 991)
    };
    skyGradient = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
    skyGradient.addColorStop(0, '#0f2a24');
    skyGradient.addColorStop(0.45, '#2f5b46');
    skyGradient.addColorStop(0.78, '#7d9a5e');
    skyGradient.addColorStop(1, '#c9c07a');
  }

  /* ---------------------------------------------------------------- helpers */
  function rect(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function quad(ctx, x1, y1, w1, x2, y2, w2, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1 - w1, y1);
    ctx.lineTo(x2 - w2, y2);
    ctx.lineTo(x2 + w2, y2);
    ctx.lineTo(x1 + w1, y1);
    ctx.closePath();
    ctx.fill();
  }

  function fogRGBA(alpha) {
    return 'rgba(' + FOG_COLOR[0] + ',' + FOG_COLOR[1] + ',' + FOG_COLOR[2] + ',' + alpha.toFixed(3) + ')';
  }

  /**
   * Draw a sprite frame, clipped so it cannot spill below `clipY` (which is the
   * top of whatever closer geometry already covered that band of screen).
   * Uses source-rect trimming rather than ctx.clip() — no state churn.
   */
  function drawSheet(ctx, key, frame, dx, dy, dw, dh, clipY, alpha, tint) {
    var s = Assets.get(key);
    if (!s || dw <= 0 || dh <= 0) return;
    if (dx + dw / 2 < 0 || dx - dw / 2 > W || dy - dh > H || dy < -dh) return;  // offscreen

    var f = s.frames > 1 ? ((frame % s.frames) + s.frames) % s.frames : 0;
    var destX = Math.round(dx - dw / 2);
    var destY = Math.round(dy - dh);
    var clipH = clipY ? Math.max(0, destY + dh - clipY) : 0;
    if (clipH >= dh) return;

    if (alpha !== undefined && alpha < 1) { ctx.save(); ctx.globalAlpha = alpha; }
    ctx.drawImage(
      s.image,
      f * s.frameW, 0, s.frameW, s.frameH - (s.frameH * clipH / dh),
      destX, destY, Math.round(dw), Math.round(dh - clipH)
    );
    if (tint) {
      ctx.save();
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = tint;
      ctx.fillRect(destX, destY, Math.round(dw), Math.round(dh - clipH));
      ctx.restore();
    }
    if (alpha !== undefined && alpha < 1) ctx.restore();
  }

  function groundShadow(ctx, x, y, w, alpha, clipY) {
    if (clipY && y > clipY) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#10210f';
    ctx.beginPath();
    ctx.ellipse(x, y, w, w * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ------------------------------------------------------------------ frame */
  var Renderer = {
    horizonY: HORIZON,
    unit: UNIT,

    init: function (ctx) { ensureAssets(ctx); },

    render: function (ctx, game) {
      ensureAssets(ctx);

      var road = CONFIG.road;
      var cam = CONFIG.camera;
      var track = game.track;
      var segCount = track.segments.length;
      var cameraDepth = Track.cameraDepth();
      var trackZ = game.trackZ;
      var cameraZ = U.wrap(trackZ, -cam.backZ, track.length);
      var baseSegment = Track.findSegment(track, cameraZ);
      var basePercent = U.percentRemaining(cameraZ, road.segmentLength);
      var playerSegment = Track.findSegment(track, trackZ);
      var playerPercent = U.percentRemaining(trackZ, road.segmentLength);
      var cameraX = game.cameraLateral * road.halfWidth;
      var cameraY = cam.height + U.lerp(baseSegment.p1.world.y, baseSegment.p2.world.y, basePercent);
      var drawDistance = cam.drawDistance;

      /* ---------------------------------------------------------- 1. sky */
      rect(ctx, 0, 0, W, HORIZON + 60, '#000');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, W, HORIZON + 60);

      // low sun, sitting just above the vanishing point
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#f6e3a8';
      ctx.beginPath();
      ctx.arc(W * 0.5 - game.skyOffset * W * 0.35, HORIZON - 46, 40, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      drawStrip(ctx, strips.far, game.skyOffset * 2.2, HORIZON - 78, 0.95);
      drawStrip(ctx, strips.near, game.treeOffset * 3.4, HORIZON - 118, 1);

      // forest floor base coat, so any un-drawn band still reads as ground
      rect(ctx, 0, HORIZON - 2, W, H - HORIZON + 2, road.colors.dark.grass);

      /* ------------------------------------------- 2. project + draw road */
      var maxy = H;
      var x = 0;
      var dx = -(baseSegment.curve * basePercent);
      var playerCurveX = 0;
      var n, seg;

      for (n = 0; n < drawDistance; n++) {

        seg.clip = maxy;

        var zOffset = cameraZ - (seg.looped ? track.length : 0);
        Track.project(seg.p1, cameraX - x, cameraY, zOffset, cameraDepth, W, UNIT, HORIZON, road.halfWidth);
        Track.project(seg.p2, cameraX - x - dx, cameraY, zOffset, cameraDepth, W, UNIT, HORIZON, road.halfWidth);

        if (seg.index === playerSegment.index) playerCurveX = x + dx * playerPercent;

        x += dx;
        dx += seg.curve;

        if (seg.p1.camera.z <= cameraDepth ||     // behind the near plane
            seg.p2.screen.y >= seg.p1.screen.y || // degenerate / inverted
            seg.p2.screen.y >= maxy) {            // hidden behind closer road
          continue;
        }
        drawSegment(ctx, seg, road);
        maxy = seg.p2.screen.y;
      }

      /* --------------------------------------------- 3. sprites, far→near */
      for (n = drawDistance - 1; n >= 0; n--) {
        seg = track.segments[(baseSegment.index + n) % segCount];
        if (seg.p1.camera.z <= cameraDepth || seg.p1.screen.scale <= 0) continue;
        var i;
        for (i = 0; i < seg.entities.length; i++) drawEntity(ctx, seg, seg.entities[i], game);
        for (i = 0; i < seg.dynamic.length; i++) drawHazard(ctx, seg, seg.dynamic[i], game);
      }

      /* ------------------------------------------------------- 4. the cat */
      drawPlayer(ctx, game, playerSegment, playerPercent, playerCurveX, cameraX, cameraY, cameraDepth);

      /* ------------------------------------------------ 5. canopy framing */
      drawVignette(ctx, game);

      FA.FX.render(ctx, game.fx);
    }
  };

  function drawStrip(ctx, strip, offset, y, alpha) {
    var w = strip.width;
    var ox = -(((offset % 1) + 1) % 1) * w;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(strip, ox, y);
    ctx.drawImage(strip, ox + w, y);
    ctx.restore();
  }

  function drawSegment(ctx, seg, road) {
    var p1 = seg.p1.screen, p2 = seg.p2.screen;
    var h = p1.y - p2.y;
    var r1 = p1.w / 5, r2 = p2.w / 5;

    rect(ctx, 0, p2.y, CONFIG.view.designWidth, h + 1, seg.color.grass);
    quad(ctx, p1.x - p1.w - r1 * 0.5, p1.y, r1 * 0.5, p2.x - p2.w - r2 * 0.5, p2.y, r2 * 0.5, seg.color.rumble);
    quad(ctx, p1.x + p1.w + r1 * 0.5, p1.y, r1 * 0.5, p2.x + p2.w + r2 * 0.5, p2.y, r2 * 0.5, seg.color.rumble);
    quad(ctx, p1.x, p1.y, p1.w, p2.x, p2.y, p2.w, seg.color.road);

    if (seg.fog < 1) {
      rect(ctx, 0, p2.y, CONFIG.view.designWidth, h + 1, fogRGBA(1 - seg.fog));
    }
  }

  function drawEntity(ctx, seg, e, game) {
    var s = seg.p1.screen;
    var scale = s.scale;
    var lift = e.yBase;
    var bob = 0;

    if (e.kind === 'pickup') {
      if (e.spent) return;
      bob = Math.sin(game.elapsed * 3 + e.bobPhase) * 40;
    }
    if (e.kind === 'obstacle' && e.spent) return;

    // How far ahead of the cat this prop sits, in segments — used to ramp the
    // obstacle cue in as it approaches.
    var relSeg = (e.kind === 'obstacle') ? segmentsAhead(game, seg.index) : 0;

    var dw = e.worldW * scale * UNIT;
    var dh = e.worldH * scale * UNIT;
    var dx = s.x + scale * e.offset * CONFIG.road.halfWidth * UNIT;

/* =============================================================================
 * hud.js — heads-up display, drawn on the canvas so it scales with the stage.
 *
 * The signature element is the trail bar: rather than a bare countdown, the
 * level timer reads as a path with the cat advancing toward the tree line at
 * the far end. The fiction of the mode ("survive until you're out of the
 * forest") is the progress indicator.

  var INK_DIM = 'rgba(244,234,214,0.62)';
  var BARK = 'rgba(24,38,28,0.72)';

    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();

    ctx.bezierCurveTo(cx - s * 1.35, cy - s * 0.25, cx - s * 0.5, cy - s * 1.1, cx, cy - s * 0.35);
    ctx.bezierCurveTo(cx + s * 0.5, cy - s * 1.1, cx + s * 1.35, cy - s * 0.25, cx, cy + s * 0.75);

    ctx.fill();

    ctx.fill();

      statusRow(ctx, game);

      if (game.state === 'intro') banner(ctx, game);
      if (CONFIG.debug.showFPS) {
        ctx.textAlign = 'left';
        ctx.font = '600 11px ' + FA.FONT_UI;
        ctx.fillStyle = INK_DIM;
        ctx.fillText(FA.t('hudFps', { fps: Math.round(game.fps) }), 12, CONFIG.view.designHeight - 14);
      }

    }

    var x = 44, w = W - 88, y = SAFE_TOP + 10, h = 7;
    var progress = U.clamp(1 - game.timeLeft / CONFIG.level.durationSec, 0, 1);

    pill(ctx, x, y, w, h, 'rgba(18,30,22,0.7)');
    pill(ctx, x, y, Math.max(h, w * progress), h, progress > 0.88 ? LEAF : AMBER);

    ctx.beginPath();
    ctx.moveTo(x - 20, y + h + 3); ctx.lineTo(x - 13, y - 7); ctx.lineTo(x - 6, y + h + 3);

    ctx.beginPath();
    ctx.moveTo(x - 13, y + h + 3); ctx.lineTo(x - 7, y - 4); ctx.lineTo(x - 1, y + h + 3);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();
    ctx.arc(x + w + 13, y + h / 2, 7, 0, Math.PI * 2);
    ctx.fill();

    // the cat, walking the bar
    var mx = x + Math.max(h, w * progress);
    ctx.fillStyle = INK;
    pawIcon(ctx, mx, y + h / 2 - 1, 5.5, INK);

    ctx.textAlign = 'center';
    ctx.font = '700 10px ' + FA.FONT_DISPLAY;
    ctx.fillStyle = INK_DIM;
    ctx.fillText(FA.t('hudLevel', { level: game.level, count: CONFIG.level.count }) +

    ctx.textAlign = 'center';
    ctx.font = '700 13px ' + FA.FONT_DISPLAY;
    ctx.fillStyle = AMBER;
    ctx.fillText(FA.t('introLevel', { level: game.level }), W / 2, H * 0.40);
    ctx.font = '700 34px ' + FA.FONT_DISPLAY;
    ctx.fillStyle = INK;
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 10;
    ctx.fillText(game.levelName, W / 2, H * 0.46);
    ctx.shadowBlur = 0;
    ctx.font = '600 12px ' + FA.FONT_UI;
    ctx.fillStyle = INK_DIM;
    ctx.fillText(FA.STR.introHint, W / 2, H * 0.50);
    ctx.restore();
  }

  FA.HUD = HUD;

      /* ---- speed: ease in at level start, dip on impact, recover */
      var target = CONFIG.speed.base * game.speedMul;
      game.rampTimer = Math.min(CONFIG.speed.rampUpTime, game.rampTimer + dt);
      var ramp = U.easeOut(game.rampTimer / CONFIG.speed.rampUpTime);

      var speedPercent = game.speed / CONFIG.speed.base;
      game.skyOffset = U.wrap(game.skyOffset, seg.curve * speedPercent * dt * 0.06, 1);
      game.treeOffset = U.wrap(game.treeOffset, seg.curve * speedPercent * dt * 0.10, 1);

      if (game.state === 'running') {
        game.timeLeft -= dt;
        if (game.timeLeft <= 0) finishLevel(game);
      }

  /* ========================================================================
   * NPCs
   * ====================================================================== */
  function updateNPCs(game, dt) {
    var total = game.track.segments.length;
    var playerRing = Math.floor(game.trackZ / CONFIG.road.segmentLength);
    var range = CONFIG.npc.activeRangeSegments;
    var lead = CONFIG.npc.dropLeadSegments;
    var rng = game.spawner.rng;

    for (var i = 0; i < game.npcs.length; i++) {
      var npc = game.npcs[i];
      if (npc.tapLock > 0) npc.tapLock -= dt;
      if (npc.flash > 0) npc.flash -= dt;
      if (npc.deactivated) { npc.fade += dt; continue; }

      // Walk across the path and turn round at the edges. Done before the
      // range check so animals are already moving when they come into view.
      var span = CONFIG.npc.crossRange;
      npc.offset += npc.dir * npc.crossSpeed * dt;
      if (npc.offset > span) { npc.offset = span; npc.dir = -1; }
      else if (npc.offset < -span) { npc.offset = -span; npc.dir = 1; }

      // How far ahead of the cat this animal is, in segments.
      var rel = ((npc.segIndex - playerRing) % total + total) % total;
      if (rel < range[0] || rel > range[1]) continue;

      npc.dropTimer -= dt;
      if (npc.dropTimer > 0) continue;
      npc.dropTimer = rng.range(npc.dropIntervalSec[0], npc.dropIntervalSec[1]);

      // Land it far enough ahead that it is on the ground before the cat
      // arrives — otherwise the hazard is decoration, not a threat.
      var fallSegments = fallDistanceSegments(game);
      var maxLead = rel - (fallSegments + 12);
      if (maxLead < lead[0]) continue;
      var chosen = Math.min(rng.int(lead[0], lead[1]), maxLead);
      var landSeg = ((npc.segIndex - chosen) % total + total) % total;

      // Drop into the lane the animal is actually standing over, so the
      // throw reads as coming from it rather than appearing at random.
      var laneOffset;
      if (CONFIG.npc.dropFromOwnLane) {
        var lanes = CONFIG.player.laneOffsets, bestLane = lanes[0];
        for (var L = 1; L < lanes.length; L++) {
          if (Math.abs(lanes[L] - npc.offset) < Math.abs(bestLane - npc.offset)) bestLane = lanes[L];
        }
        laneOffset = bestLane;
      } else {
        laneOffset = rng.pick(CONFIG.player.laneOffsets);
      }
      var type = rng.pick(npc.drops);
      var hz = Entities.hazard(type, landSeg, laneOffset);

  /** How many segments the cat covers while a hazard is in the air. */

  /* ========================================================================
   * Hazards
   * ====================================================================== */

      var hz = game.hazards[i];

        hz.y += hz.vy * dt;
        hz.spin += d.spinRate * dt;
        if (hz.y <= hz.yBase) {
          hz.y = hz.yBase;
          hz.landed = true;
          hz.splash = d.splashSec;
        }
      } else {
        if (hz.splash > 0) hz.splash -= dt;
        hz.life -= dt;

      }
    }

  function removeHazard(game, hz, index) {
    game.hazards.splice(index, 1);

   * Collision
   * ====================================================================== */
  function collide(game) {
    var total = game.track.segments.length;
    var ring = Math.floor(game.trackZ / CONFIG.road.segmentLength);
    var crossed = ((ring - game.prevRingSeg) % total + total) % total;
    // Guard against absurd deltas (a stalled tab that resumed mid-frame).
    if (crossed > 32) crossed = 32;

    for (var step = 1; step <= crossed; step++) {
      var seg = Track.segmentAt(game.track, game.prevRingSeg + step);
      testSegment(game, seg);
    }
    // Always re-test the current segment: the cat may have changed lane while
    // sitting inside a single segment for several frames.
    testSegment(game, Track.segmentAt(game.track, ring));
    game.prevRingSeg = ring;
  }

  function testSegment(game, seg) {

    if (!U.overlap1D(Player.bottom(p), Player.top(p), e.yBase, e.yBase + e.height)) return;

      game.comboTimer = CONFIG.score.comboWindowSec;
      var value = Math.round(e.value * game.combo);
      addScore(game, value, screen.x, screen.y, '+' + value);
      FX.burst(game.fx, screen.x, screen.y, 10, pickupColor(e.type), { spread: 150, size: 3, life: 0.4 });
      Audio.pickup(Math.round((game.combo - 1) / CONFIG.score.comboStep));

    game.comboTimer = 0;
    game.hitFlash = 1;
    game.hitRecover = CONFIG.player.hitRecoverTime;

    // this entity was never on screen (possible on the very first frame).
    var s = seg.p1.screen;
    if (!s || !s.scale) return { x: CONFIG.view.designWidth / 2, y: CONFIG.view.designHeight * 0.7 };

    return {
      x: s.x + s.scale * e.offset * CONFIG.road.halfWidth * unit,
      y: s.y - (e.yBase + e.height * 0.5) * s.scale * unit

  function pickupColor(type) {
    if (type === 'mushroom') return '#e8756a';
    if (type === 'shrimp') return '#f6a98e';

  /* ========================================================================
   * Level end
   * ====================================================================== */
  function finishLevel(game) {

    var bonus = CONFIG.score.levelCompleteBonus + game.player.hp * CONFIG.score.hpBonusPerHeart;
    game.score += bonus;
    game.lastResult = {
      level: game.level,
      levelName: game.levelName,
      bonus: bonus,
      hearts: game.player.hp,
      distance: Math.round(game.distanceMeters)

/* =============================================================================
 * main.js — bootstrap and the frame loop.
 *
 * Owns everything the simulation shouldn't know about: the canvas, device
 * pixel ratio, how the fixed 390x844 stage is scaled into whatever window it
 * finds itself in, the DOM overlays, and the optional on-screen buttons.
 *
 * Timing: a fixed-step accumulator. Physics always advances in 1/60 s ticks,

 * a stalled tab can never teleport the cat through an obstacle.

(function (FA) {

    canvas.width = Math.round(CONFIG.view.designWidth * dpr);
    canvas.height = Math.round(CONFIG.view.designHeight * dpr);
    canvas.style.width = CONFIG.view.designWidth + 'px';
    canvas.style.height = CONFIG.view.designHeight + 'px';

  }

  /** Uniformly scale the fixed stage to fill the window, letterboxing around it. */
  function fitStage() {
    var vw = window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var scale = Math.min(vw / CONFIG.view.designWidth, vh / CONFIG.view.designHeight);
    stage.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';

  /* ---------------------------------------------------------------- overlays */

  var OVERLAY_COPY = {
    title: function () {

        eyebrow: FA.STR.titleEyebrow,
        title: FA.STR.gameTitle,
        body: isTouch ? FA.STR.titleBody : FA.STR.titleBodyDesktop,
        stats: FA.Scores.localBest() > 0 ? [[FA.STR.localBest, U.formatScore(FA.Scores.localBest())]] : null,
        board: true,

                [FA.STR.statTimeLeft, U.formatTime(game.timeLeft)]],
        actions: [
          { label: FA.STR.resume, primary: true, act: function () { game.state = 'running'; } },
          { label: FA.STR.restartLevel, act: function () { FA.Game.startLevel(game, game.level); } }

      };
    },
    levelComplete: function () {

          [FA.STR.statBest, U.formatScore(game.bestScore)],

          [FA.STR.statAnimals, String(game.npcsDeactivated)]

  var submittedThisRun = false;

  /** Name box + send button. Only shown when a board is actually configured. */
  function renderSubmit(host, copy) {

    var row = document.createElement('div');
    row.className = 'namerow';

      send.disabled = true;
      send.textContent = FA.STR.submitting;
      note.textContent = '';

      FA.Scores.submit({
        name: name,
        score: game.score,
        level: r.level || game.level,
        distance: r.distance || 0,
        animals: game.npcsDeactivated

    title.className = 'board-title';
    title.textContent = FA.STR.boardTitle;
    var list = document.createElement('div');
    list.className = 'board';
    list.textContent = FA.STR.boardLoading;

      list.textContent = '';
      if (!rows.length) { list.textContent = FA.STR.boardEmpty; return; }
      rows.forEach(function (r, i) {

    // fast-forwarding the cat into whatever is waiting downrange.

    FA.Input.init(canvas, {
      action: function (kind) {
        FA.Audio.unlock();
        FA.Game.action(game, kind);
      },
      tap: function (x, y) { return FA.Game.tap(game, x, y); },
      pause: function () {
        FA.Game.togglePause(game);
        syncOverlay(true);
      }
    });

    document.title = FA.STR.gameTitle;
    var loadingEl = document.getElementById('loading');
    if (loadingEl) loadingEl.textContent = FA.STR.loading;
    var A11Y = { left: FA.STR.a11yLeft, right: FA.STR.a11yRight,
                 jump: FA.STR.a11yJump, slide: FA.STR.a11ySlide };
    Array.prototype.forEach.call(document.querySelectorAll('[data-action]'), function (b) {
      b.setAttribute('aria-label', A11Y[b.getAttribute('data-action')] || '');
    });
    document.getElementById('btn-pause').setAttribute('aria-label', FA.STR.a11yPause);
    document.getElementById('btn-mute').setAttribute('aria-label', FA.STR.a11yMute);

    setupTouchButtons();
    setupSystemButtons();

    // Losing focus mid-run should never cost a life.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { FA.Game.pause(game); syncOverlay(true); }
    });
    window.addEventListener('blur', function () { FA.Game.pause(game); syncOverlay(true); });

    FA.Assets.load(function () {
      FA.Renderer.init(ctx);
      // Build a track immediately so the title screen has a forest behind it.
      FA.Game.startLevel(game, 1);
      game.state = 'title';
      document.getElementById('loading').classList.add('hidden');
      syncOverlay(true);

      running = true;
      last = performance.now();
      requestAnimationFrame(frame);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  // Exposed for tinkering from the console: FA.debug.game.score = 9999
  FA.debug = { get game() { return game; } };
})(window.FA = window.FA || {});

</script>
</body>
</html>
