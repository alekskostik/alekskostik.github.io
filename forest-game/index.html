<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1410">
<title>Фаня в лесу</title>
<style>
/* =============================================================================
 * styles.css — the shell around the canvas.
 *
 * Palette is pulled from the game's own world: bark, moss, low sun, bone. The
 * UI sits on dark bark panels so it never competes with the path for attention.
 * ========================================================================== */

:root {
  --bark:      #16241b;
  --bark-deep: #0a1410;
  --moss:      #7fc46a;
  --sun:       #f2b544;
  --bone:      #f4ead6;
  --bone-dim:  rgba(244, 234, 214, 0.62);

  --font-display: "Avenir Next Condensed", "Futura", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Avenir Next", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(120% 90% at 50% 8%, #16281f 0%, var(--bark-deep) 62%, #050b08 100%);
  font-family: var(--font-ui);
  color: var(--bone);
  /* A runner must own every gesture: no scroll, no pinch, no pull-to-refresh,
     no long-press callout, no double-tap zoom. */
  touch-action: none;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

/* --------------------------------------------------------------- the stage */
#stage {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 390px;
  height: 844px;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  overflow: hidden;
  border-radius: 22px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
  background: var(--bark-deep);
}

#game {
  display: block;
  width: 390px;
  height: 844px;
  touch-action: none;
}

/* ------------------------------------------------------------------ menus */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 26px;
  background: linear-gradient(180deg, rgba(6, 14, 10, 0.62), rgba(6, 14, 10, 0.9));
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

.overlay.hidden,
#loading.hidden { display: none; }

.card {
  width: 100%;
  padding: 26px 22px 22px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(28, 46, 34, 0.96), rgba(16, 28, 21, 0.96));
  border: 1px solid rgba(244, 234, 214, 0.12);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
  text-align: left;
}

.eyebrow {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--sun);
}

.card h1 {
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-size: 36px;
  line-height: 1.02;
  letter-spacing: -0.01em;
  font-weight: 700;
}

.card .body {
  margin: 0 0 16px;
  font-size: 14px;
  line-height: 1.45;
  color: var(--bone-dim);
}

#ov-stats { margin-bottom: 18px; }

.stat {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid rgba(244, 234, 214, 0.09);
  font-size: 13px;
}

.stat:last-child { border-bottom: none; }
.stat span { color: var(--bone-dim); }
.stat b { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.01em; }

.actions { display: flex; flex-direction: column; gap: 9px; }

.btn {
  appearance: none;
  width: 100%;
  padding: 14px 16px;
  border-radius: 13px;
  border: 1px solid rgba(244, 234, 214, 0.16);
  background: rgba(244, 234, 214, 0.07);
  color: var(--bone);
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: transform 0.09s ease, background 0.15s ease;
}

.btn:hover { background: rgba(244, 234, 214, 0.13); }
.btn:active { transform: scale(0.985); }

.btn-primary {
  background: linear-gradient(180deg, var(--sun), #d99a2b);
  border-color: rgba(0, 0, 0, 0.2);
  color: #21160a;
  font-weight: 700;
}

.btn-primary:hover { background: linear-gradient(180deg, #ffc659, #e0a230); }

.btn:focus-visible,
.tbtn:focus-visible,
.sysbtn:focus-visible {
  outline: 2px solid var(--moss);
  outline-offset: 2px;
}

/* ------------------------------------------------------------ thumb pads */
#touch-controls {
  position: absolute;
  inset: 0;
  pointer-events: none;   /* only the buttons themselves take input */
}

.pad { position: absolute; display: flex; align-items: flex-end; gap: 10px; }
.pad-left { left: 16px; bottom: 26px; }
.pad-right { right: 16px; bottom: 26px; flex-direction: column; align-items: flex-end; }

.tbtn {
  pointer-events: auto;
  width: 66px;
  height: 66px;
  padding: 0;
  border-radius: 22px;
  border: 1px solid rgba(244, 234, 214, 0.16);
  background: rgba(12, 24, 17, 0.42);
  color: var(--bone);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  cursor: pointer;
  transition: background 0.1s ease, transform 0.08s ease;
}

.tbtn svg { width: 30px; height: 30px; fill: currentColor; }
.tbtn.pressed { background: rgba(127, 196, 106, 0.34); transform: scale(0.94); }

.tbtn-small { width: 54px; height: 54px; border-radius: 18px; opacity: 0.9; }
.tbtn-small svg { width: 24px; height: 24px; }
.tbtn-jump { width: 78px; height: 78px; border-radius: 26px; }
.tbtn-jump svg { width: 34px; height: 34px; }

/* -------------------------------------------------------- pause and sound */
#system-buttons {
  position: absolute;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sysbtn {
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid rgba(244, 234, 214, 0.14);
  background: rgba(12, 24, 17, 0.42);
  color: var(--bone-dim);
  cursor: pointer;
}

.sysbtn svg { width: 20px; height: 20px; fill: currentColor; }
.sysbtn:active { transform: scale(0.94); }
.sysbtn .cross { display: none; }
.sysbtn.off .wave { display: none; }
.sysbtn.off .cross { display: block; }

/* ----------------------------------------------------------------- loading */
#loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.06em;
  color: var(--bone-dim);
  background: var(--bark-deep);
}

@media (prefers-reduced-motion: reduce) {
  .btn, .tbtn, .sysbtn { transition: none; }
}

/* ------------------------------------------------------- leaderboard */
.namerow { display: flex; gap: 8px; margin-bottom: 8px; }

.nameinput {
  flex: 1 1 auto;
  min-width: 0;
  padding: 12px 13px;
  border-radius: 12px;
  border: 1px solid rgba(244, 234, 214, 0.18);
  background: rgba(10, 20, 14, 0.55);
  color: var(--bone);
  font-family: var(--font-ui);
  font-size: 15px;               /* 16px or above stops iOS zooming on focus */
}

.nameinput::placeholder { color: rgba(244, 234, 214, 0.38); }
.nameinput:focus { outline: 2px solid var(--moss); outline-offset: 1px; }

.btn-send { width: auto; flex: 0 0 auto; padding: 12px 15px; font-size: 14px; }
.btn-send:disabled { opacity: 0.55; cursor: default; }

.note { margin: 0 0 10px; font-size: 12px; line-height: 1.35; color: var(--sun); }

.board-title {
  margin: 14px 0 6px;
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--bone-dim);
}

.board {
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--bone-dim);
  max-height: 168px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.board-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(244, 234, 214, 0.07);
}

.board-row:last-child { border-bottom: none; }
.board-row .rank { width: 22px; color: rgba(244, 234, 214, 0.4); font-variant-numeric: tabular-nums; }
.board-row .who {
  flex: 1 1 auto;
  color: var(--bone);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;           /* a long name must not break the layout */
}
.board-row b { font-family: var(--font-display); color: var(--sun); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------- title-screen portrait */
.portrait {
  position: relative;
  width: 148px;
  height: 148px;
  margin: 0 auto 18px;
  border-radius: 50%;
  /* Sits in a warm ring so the photo reads as lit by the same low sun as the
     forest behind it, whatever its own colour balance turns out to be. */
  background:
    radial-gradient(circle at 50% 30%, rgba(242, 181, 68, 0.35), transparent 68%),
    linear-gradient(180deg, rgba(127, 196, 106, 0.25), rgba(10, 20, 14, 0.5));
  box-shadow:
    0 0 0 2px rgba(242, 181, 68, 0.55),
    0 0 26px rgba(242, 181, 68, 0.22),
    0 12px 30px rgba(0, 0, 0, 0.45);
  opacity: 0;
  transform: scale(0.86) translateY(10px);
}

.portrait.ready {
  animation: portrait-in 720ms cubic-bezier(0.18, 0.9, 0.28, 1.08) forwards;
}

.portrait img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;              /* any aspect ratio crops to the circle */
  display: block;
}

/* A slow sheen crossing the ring, so the card isn't completely static. */
.portrait::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: linear-gradient(115deg, transparent 38%, rgba(255, 245, 220, 0.30) 50%, transparent 62%);
  opacity: 0;
  pointer-events: none;
}

.portrait.ready::after { animation: portrait-sheen 4.5s ease-in-out 0.7s infinite; }

@keyframes portrait-in {
  0%   { opacity: 0; transform: scale(0.86) translateY(10px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes portrait-sheen {
  0%, 72%, 100% { opacity: 0; }
  80%           { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .portrait.ready { animation: none; opacity: 1; transform: none; }
  .portrait.ready::after { animation: none; }
}

/* ------------------------------------------------------- field guide */
#ov-legend { max-height: 52vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }

.legend-head {
  margin: 14px 0 4px;
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--sun);
}

.legend-head:first-child { margin-top: 0; }

.legend-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(244, 234, 214, 0.07);
}

.legend-row:last-child { border-bottom: none; }

.thumb {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: 9px;
  background: rgba(10, 20, 14, 0.5);
}

.legend-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.legend-text b { font-size: 13px; color: var(--bone); }
.legend-text span { font-size: 11.5px; line-height: 1.3; color: var(--bone-dim); }

.legend-points {
  flex: 0 0 auto;
  font-family: var(--font-display);
  font-style: normal;
  font-size: 14px;
  color: var(--moss);
}

/* ------------------------------------------------ victory celebration */
/* Thinner scrim and no blur, so the fireworks on the canvas actually read
   through the card's backdrop instead of turning into grey haze. */
.overlay.celebrate {
  background: linear-gradient(180deg, rgba(6, 14, 10, 0.30), rgba(6, 14, 10, 0.68));
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.overlay.celebrate .card {
  background: linear-gradient(180deg, rgba(30, 50, 36, 0.93), rgba(16, 28, 21, 0.95));
  box-shadow: 0 0 0 1px rgba(242, 181, 68, 0.30), 0 18px 60px rgba(0, 0, 0, 0.6);
}

.overlay.celebrate .portrait {
  box-shadow:
    0 0 0 3px rgba(242, 181, 68, 0.85),
    0 0 32px rgba(242, 181, 68, 0.45),
    0 12px 30px rgba(0, 0, 0, 0.45);
}

.overlay.celebrate .portrait.ready { animation: portrait-in 720ms cubic-bezier(0.18, 0.9, 0.28, 1.08) forwards, crown-glow 2.6s ease-in-out 0.8s infinite; }

@keyframes crown-glow {
  0%, 100% { filter: none; }
  50%      { filter: brightness(1.08); }
}

@media (prefers-reduced-motion: reduce) {
  .overlay.celebrate .portrait.ready { animation: none; opacity: 1; transform: none; }
}

</style>
</head>
<body>

<!-- The stage is a fixed 390x844 box (iPhone 12-17 logical viewport). It is
     uniformly scaled by main.js to fit whatever window it lands in, so the
     desktop build frames the action exactly like the phone build. -->
<div id="stage">
  <canvas id="game" width="390" height="844"></canvas>

  <!-- ---------------------------------------------------- menus / results -->
  <div id="overlay" class="overlay hidden">
    <div class="card">
      <div id="ov-photo"></div>
      <p class="eyebrow" id="ov-eyebrow"></p>
      <h1 id="ov-title"></h1>
      <p class="body" id="ov-body"></p>
      <div id="ov-stats"></div>
      <div id="ov-legend"></div>
      <div id="ov-submit"></div>
      <div id="ov-board"></div>
      <div class="actions" id="ov-actions"></div>
    </div>
  </div>

  <!-- ------------------------------------------------ optional thumb pads -->
  <div id="touch-controls">
    <div class="pad pad-left">
      <button class="tbtn" data-action="left" aria-label="Влево">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20 Z"/></svg>
      </button>
      <button class="tbtn" data-action="right" aria-label="Вправо">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20 Z"/></svg>
      </button>
    </div>
    <div class="pad pad-right">
      <button class="tbtn tbtn-small" data-action="slide" aria-label="Подкат">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9 L12 16 L19 9" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="18" width="16" height="2.6" rx="1.3"/></svg>
      </button>
      <button class="tbtn tbtn-jump" data-action="jump" aria-label="Прыжок">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 14 L12 7 L19 14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="18" width="16" height="2.6" rx="1.3"/></svg>
      </button>
    </div>
  </div>

  <!-- ------------------------------------------------------ pause / sound -->
  <div id="system-buttons">
    <button id="btn-pause" class="sysbtn" aria-label="Пауза">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="4" height="14" rx="1.4"/><rect x="13" y="5" width="4" height="14" rx="1.4"/></svg>
    </button>
    <button id="btn-mute" class="sysbtn" aria-label="Выключить звук">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 h4 l5 -4 v14 l-5 -4 H4 Z"/><path class="wave" d="M16 9.5 a4 4 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16.5 9.5 L21 14.5 M21 9.5 L16.5 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="loading">Лес просыпается…</div>
</div>

<!-- Load order matters: each module reads the ones above it at define time.
     Plain scripts (not ES modules) so the game also runs from a file:// URL
     with no server and no build step. -->
<script>
/* ===== src/config.js ================================================= */
/* =============================================================================
 * config.js — ALL tunable numbers live here. No balance value is hardcoded
 * anywhere else in the codebase. To re-balance the game, edit only this file.
 *
 * Unit system
 *   world units : arbitrary 3D units; road.halfWidth is the reference scale
 *   z           : distance along the track, in world units
 *   offset      : lateral position in multiples of road.halfWidth, so
 *                 -1 = left edge of the path, 0 = centre, +1 = right edge
 *   meters      : cosmetic distance for score, = z / score.unitsPerMeter
 * ========================================================================== */
(function (FA) {
  'use strict';

  FA.CONFIG = {
    /* ---------------------------------------------------------------- view */
    view: {
      // iPhone 12/13/14 logical viewport. 15/16/17 are 393x852 — close enough
      // that we letterbox instead of reflowing. The stage is uniformly scaled
      // to fit any window, so desktop gets the exact mobile framing.
      designWidth: 390,
      designHeight: 844,
      maxDeltaMs: 250,       // clamp after a tab switch or breakpoint stall
      fixedStep: 1 / 60,     // deterministic physics tick
      maxSubSteps: 5,        // catch-up ceiling (prevents the spiral of death)
      pixelRatioCap: 2       // don't render at 3x on Pro models — costs FPS
    },

    /* -------------------------------------------------------------- camera */
    camera: {
      height: 1800,          // eye height above the path
      backZ: 900,            // how far behind the cat the camera sits
      fieldOfView: 100,      // degrees
      horizonRatio: 0.40,    // horizon line as a fraction of screen height
      drawDistance: 180,     // segments rendered per frame
      fogDensity: 4.2,       // higher = thicker forest haze
      lateralFollow: 0.34,   // 0 = camera locked to centre, 1 = glued to cat
      lateralLag: 6.0        // camera pan smoothing (higher = snappier)
    },

    /* ---------------------------------------------------------------- road */
    road: {
      segmentLength: 200,
      halfWidth: 1200,
      rumbleLength: 4,       // segments per colour band
      totalSegments: 1200,   // the track is a ring; ~40 s per lap at base speed
      curve: {               // the path is never straight for long
        gentle: 1.6,
        medium: 3.4,
        sharp: 5.2,
        straightRun: [14, 40],   // segments [min, max]
        curveRun: [50, 130],
        hillHeight: 260,
        hillChance: 0.55
      },
      colors: {
        light: { road: '#8a6a45', grass: '#2f5a33', rumble: '#c8a86a' },
        dark:  { road: '#7d5f3d', grass: '#28502d', rumble: '#a98b52' }
      }
    },

    /* -------------------------------------------------------------- player */
    player: {
      laneOffsets: [-0.62, 0, 0.62],
      startLane: 1,
      laneChangeSpeed: 4.2,      // offset units/sec (~0.3 s per lane)
      jumpVelocity: 2600,        // world units/sec  -> apex ~600
      gravity: 5600,             // world units/sec^2 -> airtime ~0.93 s
      fastFallMultiplier: 2.4,   // slide input while airborne = slam down
      standHeight: 560,          // hitbox height while running
      slideHeight: 220,          // hitbox height while sliding
      slideDuration: 0.62,
      slideCooldown: 0.12,
      hitboxHalfWidth: 0.16,     // narrower than the sprite = forgiving
      startHP: 3,                // hearts you begin a run with
      maxHP: 5,                  // ceiling: the barn can take you above the start
      invulnerableAfterHit: 1.5, // i-frames + blink
      hitSlowdown: 0.45,         // speed multiplier applied on impact
      hitRecoverTime: 0.9
    },

    /* --------------------------------------------------------------- speed */
    speed: {
      base: 4500,                // world units/sec at level 1
      levelStep: 0.10,           // +10% per level
      maxMultiplier: 1.9,
      rampUpTime: 1.2            // ease-in at level start
    },

    /* --------------------------------------------------------------- level */
    level: {
      durationSec: 90,          // "you run out of the forest" after this
      count: 5,
      introSec: 1.6,             // banner before the level clock starts
      heartsRestoredOnClear: 0   // small mercy between levels
    },

    /* --------------------------------------------------------------- score */
    score: {
      unitsPerMeter: 250,
      perMeter: 1,
      pickup: { mushroom: 25, berry: 15, shrimp: 60 },
      npcDeactivated: 120,
      levelCompleteBonus: 500,
      hpBonusPerHeart: 150,
      comboStep: 0.1,            // +10% per pickup in a chain
      comboMax: 3.0,
      comboWindowSec: 2.0
    },

    /* --------------------------------------------------------------- spawn */
    spawn: {
      startSafeSegments: 90,     // grace zone at the start of a level
      lookaheadSegments: 300,    // populate this far ahead (beyond draw range)
      minGapSegments: 22,
      gapJitter: 16,
      difficultyRamp: 0.35,      // how much the level number tightens spacing
      sceneryEvery: 3,
      sceneryDensity: 0.85,
      patternWeights: {
        singleObstacle: 24,
        doubleObstacle: 12,
        lowBranch: 10,
        pickupLine: 32,
        pickupArc: 20,
        npc: 22
      }
    },

    /* ----------------------------------------------------- entity catalogue
     * avoid : 'jump'  — clear it by jumping
     *         'slide' — duck under it
     *         'lane'  — too tall to jump, must change lane
     * yBase : bottom of the hitbox above the path, in world units
     * height: hitbox height (independent of the drawn sprite size)
     */
    obstacles: {
      rock:   { sprite: 'rock',   avoid: 'jump',  halfWidth: 0.18, yBase: 0,   height: 300, worldW: 420,  worldH: 340 },
      log:    { sprite: 'log',    avoid: 'jump',  halfWidth: 0.30, yBase: 0,   height: 240, worldW: 760,  worldH: 280 },
      branch: { sprite: 'branch', avoid: 'slide', halfWidth: 0.52, yBase: 380, height: 420, worldW: 1250, worldH: 520 },
      stump:  { sprite: 'stump',  avoid: 'jump',  halfWidth: 0.20, yBase: 0,   height: 300, worldW: 460,  worldH: 380 },
      bush:   { sprite: 'bush',   avoid: 'jump',  halfWidth: 0.24, yBase: 0,   height: 320, worldW: 620,  worldH: 400 }
    },

    pickups: {
      mushroom: { sprite: 'mushroom', halfWidth: 0.30, yBase: 40,  height: 340, worldW: 400, worldH: 400 },
      berry:    { sprite: 'berry',    halfWidth: 0.30, yBase: 40,  height: 320, worldW: 380, worldH: 380 },
      shrimp:   { sprite: 'shrimp',   halfWidth: 0.30, yBase: 300, height: 320, worldW: 460, worldH: 380 }
    },

    /* ----------------------------------------------------------------- NPC */
    /* A slow brightness pulse on obstacles, ramping in as they approach, so
     * the thing you must react to separates itself from the scenery. Kept
     * deliberately low-amplitude: a cue, not a strobe. enabled:false removes
     * it entirely. */
    obstacleCue: {
      enabled: true,
      nearSegments: 45,        // start pulsing once this close
      amplitude: 0.34,         // peak overlay alpha at closest approach
      speedHz: 1.6,            // pulses per second
      color: '255,244,214',    // warm bone; matches the low sun

/* =============================================================================
 * audio.js — synthesised SFX. No audio files to ship, nothing to preload.

    slide:      function () { blip(300, 140, 0.20, 'sawtooth', 0.35); },

/* ===== src/fx.js ===================================================== */
/* =============================================================================
 * fx.js — screen-space particles and floating score popups.
 *
 * Deliberately screen-space rather than world-space: these are feedback for

 * the GC never runs mid-run.

      return {

          return { alive: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 3, color: '#fff', gravity: 0 };
        }),
        texts: makePool(MAX_TEXTS, function () {
          return { alive: false, x: 0, y: 0, vy: 0, life: 0, maxLife: 1, text: '', color: '#fff', size: 16 };

        ti: 0

      var size = opts.size || 3;

 * renderer.js — draws one frame.
 *
 * Pipeline per frame:
 *   1. sky + parallax tree bands           (cheap, cached offscreen strips)
 *   2. road segments, near to far, with a running `maxy` clip so distant
 *      segments never paint over closer ones

 * ========================================================================== */

  'use strict';

  var U = FA.Utils;

  var H = CONFIG.view.designHeight;

/* =============================================================================
 * fireworks.js — the celebration behind the victory card.

 * at a time on average: the victory card sits on top of this, and a sky full

  // still looks like this forest at dusk rather than a generic party.

                   size: 2, color: '#fff', drag: 0.98 };

        rockets: makePool(MAX_ROCKETS, function () {
          return { alive: false, x: 0, y: 0, vx: 0, vy: 0, fuse: 0, color: '#fff' };

        nextLaunch: 0.15,
        elapsed: 0,

        r.x = W * (0.18 + Math.random() * 0.64);
        r.y = H + 10;
        r.vx = (Math.random() - 0.5) * 60;
        r.vy = -(430 + Math.random() * 170);
        r.fuse = 0.75 + Math.random() * 0.45;

        fw.si = (fw.si + 1) % fw.sparks.length;
        var a = (i / count) * Math.PI * 2 + Math.random() * 0.25;
        var speed = 90 + Math.random() * 130;

        s.y = y;
        s.vx = Math.cos(a) * speed;
        s.vy = Math.sin(a) * speed;

        s.size = 1.6 + Math.random() * 2.0;

/* ===== src/hud.js ==================================================== */
/* =============================================================================
 * hud.js — heads-up display, drawn on the canvas so it scales with the stage.
 *
 * The signature element is the trail bar: rather than a bare countdown, the
 * level timer reads as a path with the cat advancing toward the tree line at
 * the far end. The fiction of the mode ("survive until you're out of the
 * forest") is the progress indicator.
 * ========================================================================== */
(function (FA) {
  'use strict';

  var CONFIG = FA.CONFIG;
  var U = FA.Utils;
  var W = CONFIG.view.designWidth;

  var SAFE_TOP = 16;          // leaves room under a notch / Dynamic Island
  var INK = '#f4ead6';
  var INK_DIM = 'rgba(244,234,214,0.62)';
  var BARK = 'rgba(24,38,28,0.72)';
  var AMBER = '#f2b544';
  var LEAF = '#7fc46a';

  function pill(ctx, x, y, w, h, fill) {
    var r = h / 2;
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function heart(ctx, cx, cy, s, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.75);
    ctx.bezierCurveTo(cx - s * 1.35, cy - s * 0.25, cx - s * 0.5, cy - s * 1.1, cx, cy - s * 0.35);
    ctx.bezierCurveTo(cx + s * 0.5, cy - s * 1.1, cx + s * 1.35, cy - s * 0.25, cx, cy + s * 0.75);
    ctx.closePath();
    ctx.fill();
  }

  function pawIcon(ctx, cx, cy, s, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.ellipse(cx, cy + s * 0.30, s * 0.62, s * 0.48, 0, 0, Math.PI * 2);
    ctx.fill();
    for (var i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(cx + (i - 1) * s * 0.46, cy - s * 0.42, s * 0.20, s * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();

    render: function (ctx, game) {

      scoreBlock(ctx, game);
      statusRow(ctx, game);

      if (game.state === 'intro') banner(ctx, game);
      if (CONFIG.debug.showFPS) {
        ctx.textAlign = 'left';
        ctx.font = '600 11px ' + FA.FONT_UI;
        ctx.fillStyle = INK_DIM;
        ctx.fillText(FA.t('hudFps', { fps: Math.round(game.fps) }), 12, CONFIG.view.designHeight - 14);
      }

      ctx.restore();
    }
  };

  /* -------------------------------------------- the trail / level progress */
  function trailBar(ctx, game) {
    var x = 44, w = W - 88, y = SAFE_TOP + 10, h = 7;
    var progress = U.clamp(1 - game.timeLeft / CONFIG.level.durationSec, 0, 1);

    pill(ctx, x, y, w, h, 'rgba(18,30,22,0.7)');
    pill(ctx, x, y, Math.max(h, w * progress), h, progress > 0.88 ? LEAF : AMBER);

    // start of the trail: dense trees. end of the trail: daylight.
    ctx.fillStyle = INK_DIM;
    ctx.beginPath();
    ctx.moveTo(x - 20, y + h + 3); ctx.lineTo(x - 13, y - 7); ctx.lineTo(x - 6, y + h + 3);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - 13, y + h + 3); ctx.lineTo(x - 7, y - 4); ctx.lineTo(x - 1, y + h + 3);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = progress > 0.88 ? '#ffe9a0' : 'rgba(244,234,214,0.5)';
    ctx.beginPath();
    ctx.arc(x + w + 13, y + h / 2, 7, 0, Math.PI * 2);
    ctx.fill();

    // the cat, walking the bar
    var mx = x + Math.max(h, w * progress);
    ctx.fillStyle = INK;
    pawIcon(ctx, mx, y + h / 2 - 1, 5.5, INK);

    ctx.textAlign = 'center';
    ctx.font = '700 10px ' + FA.FONT_DISPLAY;
    ctx.fillStyle = INK_DIM;
    ctx.fillText(FA.t('hudLevel', { level: game.level, count: CONFIG.level.count }) +
                 '   ·   ' + FA.t('hudTimeLeft', { time: U.formatTime(game.timeLeft) }),
                 W / 2, y + h + 14);

  function scoreBlock(ctx, game) {

    ctx.textAlign = 'left';
    ctx.font = '700 30px ' + FA.FONT_DISPLAY;
    ctx.fillStyle = INK;
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 6;
    ctx.fillText(U.formatScore(game.score), 16, y + 14);

      ctx.textAlign = 'right';
      ctx.font = '700 13px ' + FA.FONT_DISPLAY;
      ctx.fillStyle = INK;
      ctx.fillText(game.player.hp + '/' + max, W - 36, y + 5);
    }

    var label = String(game.npcsDeactivated);
    ctx.textAlign = 'right';
    var textW = 26 + label.length * 8;
    pill(ctx, W - 16 - textW, y + 18, textW, 22, BARK);
    ctx.font = '700 12px ' + FA.FONT_DISPLAY;
    ctx.fillStyle = INK;
    ctx.fillText(label, W - 22, y + 30);
    pawIcon(ctx, W - 16 - textW + 14, y + 29, 6, LEAF);
  }

    var t = U.clamp(game.introTimer / CONFIG.level.introSec, 0, 1);

    ctx.globalAlpha = Math.min(1, t * 2.2);
    ctx.textAlign = 'center';
    ctx.font = '700 13px ' + FA.FONT_DISPLAY;
    ctx.fillStyle = AMBER;
    ctx.fillText(FA.t('introLevel', { level: game.level }), W / 2, H * 0.40);
    ctx.font = '700 34px ' + FA.FONT_DISPLAY;
    ctx.fillStyle = INK;
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 10;
    ctx.fillText(game.levelName, W / 2, H * 0.46);
    ctx.shadowBlur = 0;
    ctx.font = '600 12px ' + FA.FONT_UI;
    ctx.fillStyle = INK_DIM;
    ctx.fillText(FA.STR.introHint, W / 2, H * 0.50);
    ctx.restore();
  }

  FA.HUD = HUD;
})(window.FA = window.FA || {});

 * game.js — simulation and rules. No drawing, no DOM.
 *

 *                                                        |
 *                                                    victory (last level)

        hitRecover: 0,

        introTimer: 0,
        elapsed: 0,
        score: 0,
        scoreAcc: 0,
        combo: 1,
        comboTimer: 0,
        npcsDeactivated: 0,
        distanceMeters: 0,
        cameraLateral: 0,

      game.spawner = Spawner.create(game, game.seed + level * 104729);

      game.hazards.length = 0;
      game.position = 0;
      game.trackZ = 0;
      game.absSegment = 0;
      game.prevRingSeg = 0;
      game.speedMul = Math.min(s.maxMultiplier, 1 + (level - 1) * s.levelStep);

      }

      game.elapsed += dt;

      /* ---- speed: ease in at level start, dip on impact, recover */
      var target = CONFIG.speed.base * game.speedMul;
      game.rampTimer = Math.min(CONFIG.speed.rampUpTime, game.rampTimer + dt);
      var ramp = U.easeOut(game.rampTimer / CONFIG.speed.rampUpTime);
      if (game.hitRecover > 0) {
        game.hitRecover = Math.max(0, game.hitRecover - dt);
        var k = 1 - game.hitRecover / CONFIG.player.hitRecoverTime;
        ramp *= U.lerp(CONFIG.player.hitSlowdown, 1, U.easeOut(k));
      }
      game.speed = target * ramp;

      /* ---- advance along the track */
      var moved = game.speed * dt;
      game.position += moved;
      game.trackZ = game.position % game.track.length;
      game.absSegment = Math.floor(game.position / CONFIG.road.segmentLength);
      game.distanceMeters = game.position / CONFIG.score.unitsPerMeter;

      /* ---- systems */
      Spawner.update(game.spawner, game);
      Player.update(game.player, dt);
      updateNPCs(game, dt);
      updateHazards(game, dt);
      updateBarnSchedule(game, dt);
      collide(game);
      // A fatal collision ends the run mid-tick. Bail out here rather than
      // finishing the frame, or the passive distance score awards one last
      // point after death and the results screen reads above the best score.
      if (game.state !== 'running' && game.state !== 'intro') return;

      /* ---- combo decay */
      if (game.comboTimer > 0) {
        game.comboTimer -= dt;
        if (game.comboTimer <= 0) game.combo = 1;
      }

      /* ---- passive distance score */
      game.scoreAcc += (moved / CONFIG.score.unitsPerMeter) * CONFIG.score.perMeter;
      if (game.scoreAcc >= 1) {
        var whole = Math.floor(game.scoreAcc);
        game.score += whole;
        game.scoreAcc -= whole;
      }

      /* ---- camera + parallax */
      game.cameraLateral = U.damp(game.cameraLateral,
                                  game.player.offset * CONFIG.camera.lateralFollow,
                                  CONFIG.camera.lateralLag, dt);
      var seg = Track.findSegment(game.track, game.trackZ);
      var speedPercent = game.speed / CONFIG.speed.base;
      game.skyOffset = U.wrap(game.skyOffset, seg.curve * speedPercent * dt * 0.06, 1);
      game.treeOffset = U.wrap(game.treeOffset, seg.curve * speedPercent * dt * 0.10, 1);

      /* ---- level timer */
      if (game.state === 'running') {
        game.timeLeft -= dt;
        if (game.timeLeft <= 0) finishLevel(game);
      }
    },

    /* ------------------------------------------------------------ endpoints */
    nextLevel: function (game) {
      if (game.level >= CONFIG.level.count) {
        game.state = 'victory';
        return;
      }
      var p = game.player;
      p.hp = Math.min(CONFIG.player.maxHP, p.hp + CONFIG.level.heartsRestoredOnClear);
      Game.startLevel(game, game.level + 1);
    }
  };

  /* ========================================================================
   * NPCs
   * ====================================================================== */
  function updateNPCs(game, dt) {
    var total = game.track.segments.length;
    var playerRing = Math.floor(game.trackZ / CONFIG.road.segmentLength);
    var range = CONFIG.npc.activeRangeSegments;
    var lead = CONFIG.npc.dropLeadSegments;
    var rng = game.spawner.rng;

    for (var i = 0; i < game.npcs.length; i++) {
      var npc = game.npcs[i];
      if (npc.tapLock > 0) npc.tapLock -= dt;
      if (npc.flash > 0) npc.flash -= dt;
      if (npc.deactivated) { npc.fade += dt; continue; }

      // Walk across the path and turn round at the edges. Done before the
      // range check so animals are already moving when they come into view.
      var span = CONFIG.npc.crossRange;
      npc.offset += npc.dir * npc.crossSpeed * dt;
      if (npc.offset > span) { npc.offset = span; npc.dir = -1; }
      else if (npc.offset < -span) { npc.offset = -span; npc.dir = 1; }

      // How far ahead of the cat this animal is, in segments.
      var rel = ((npc.segIndex - playerRing) % total + total) % total;
      if (rel < range[0] || rel > range[1]) continue;

      npc.dropTimer -= dt;
      if (npc.dropTimer > 0) continue;
      npc.dropTimer = rng.range(npc.dropIntervalSec[0], npc.dropIntervalSec[1]);

      // Land it far enough ahead that it is on the ground before the cat
      // arrives — otherwise the hazard is decoration, not a threat.
      var fallSegments = fallDistanceSegments(game);
      var maxLead = rel - (fallSegments + 12);
      if (maxLead < lead[0]) continue;
      var chosen = Math.min(rng.int(lead[0], lead[1]), maxLead);
      var landSeg = ((npc.segIndex - chosen) % total + total) % total;

      // Drop into the lane the animal is actually standing over, so the
      // throw reads as coming from it rather than appearing at random.
      var laneOffset;
      if (CONFIG.npc.dropFromOwnLane) {
        var lanes = CONFIG.player.laneOffsets, bestLane = lanes[0];
        for (var L = 1; L < lanes.length; L++) {
          if (Math.abs(lanes[L] - npc.offset) < Math.abs(bestLane - npc.offset)) bestLane = lanes[L];
        }
        laneOffset = bestLane;
      } else {
        laneOffset = rng.pick(CONFIG.player.laneOffsets);
      }
      var type = rng.pick(npc.drops);
      var hz = Entities.hazard(type, landSeg, laneOffset);
      Track.segmentAt(game.track, landSeg).dynamic.push(hz);
      game.hazards.push(hz);
    }
  }

  /** How many segments the cat covers while a hazard is in the air. */
  function fallDistanceSegments(game) {
    var d = CONFIG.hazardDrop;
    var t = Math.sqrt(2 * d.startHeight / d.gravity);
    return Math.ceil(game.speed * t / CONFIG.road.segmentLength);
  }

  /* ========================================================================
   * Hazards
   * ====================================================================== */
  function updateHazards(game, dt) {
    var d = CONFIG.hazardDrop;
    for (var i = game.hazards.length - 1; i >= 0; i--) {
      var hz = game.hazards[i];
      if (!hz.landed) {
        hz.vy -= d.gravity * dt;
        hz.y += hz.vy * dt;
        hz.spin += d.spinRate * dt;
        if (hz.y <= hz.yBase) {
          hz.y = hz.yBase;
          hz.landed = true;
          hz.splash = d.splashSec;
        }
      } else {
        if (hz.splash > 0) hz.splash -= dt;
        hz.life -= dt;
        if (hz.life <= 0) removeHazard(game, hz, i);
      }
    }
  }

  function removeHazard(game, hz, index) {
    game.hazards.splice(index, 1);
    var seg = Track.segmentAt(game.track, hz.segIndex);
    var at = seg.dynamic.indexOf(hz);
    if (at >= 0) seg.dynamic.splice(at, 1);
  }

  /* ========================================================================
   * Collision
   * ====================================================================== */
  function collide(game) {
    var total = game.track.segments.length;
    var ring = Math.floor(game.trackZ / CONFIG.road.segmentLength);
    var crossed = ((ring - game.prevRingSeg) % total + total) % total;
    // Guard against absurd deltas (a stalled tab that resumed mid-frame).
    if (crossed > 32) crossed = 32;

    for (var step = 1; step <= crossed; step++) {
      var seg = Track.segmentAt(game.track, game.prevRingSeg + step);
      testSegment(game, seg);
    }
    // Always re-test the current segment: the cat may have changed lane while
    // sitting inside a single segment for several frames.
    testSegment(game, Track.segmentAt(game.track, ring));
    game.prevRingSeg = ring;
  }

  /**
   * Plant a barn on the path ahead and clear a little room around its doorway,
   * so reaching it is a choice rather than a gamble against whatever the
   * spawner happened to put there.
   */
  function plantBarn(game) {
    var M = CONFIG.minigame;
    var lane = CONFIG.player.laneOffsets[game.barnRng.int(0, CONFIG.player.laneOffsets.length - 1)];
    var at = game.absSegment + M.plantAheadSegments;

    for (var d = -M.clearRadiusSegments; d <= M.clearRadiusSegments; d++) {
      var seg = Track.segmentAt(game.track, at + d);
      var keep = [];
      for (var i = 0; i < seg.entities.length; i++) {
        var e = seg.entities[i];
        var inLane = e.kind === 'obstacle' &&
                     Math.abs(e.offset - lane) < (e.halfWidth + CONFIG.player.hitboxHalfWidth + 0.05);
        if (!inLane) keep.push(e);
      }
      seg.entities = keep;
    }

    var barn = Entities.barn(lane);
    var host = Track.segmentAt(game.track, at);
    barn.segIndex = host.index;
    host.entities.push(barn);
  }

  function updateBarnSchedule(game, dt) {
    if (!CONFIG.minigame.enabled) return;
    var elapsed = CONFIG.level.durationSec - game.timeLeft;
    while (game.barnQueue.length && elapsed >= game.barnQueue[0]) {
      game.barnQueue.shift();
      plantBarn(game);
    }
  }

  function enterMinigame(game, barn) {
    barn.used = true;
    barn.spent = true;
    game.minigame = FA.Minigame.create(game.seed + game.level * 31 + game.barnsEntered, game.level);
    game.barnsEntered++;
    game.state = 'minigame';
    FA.Audio.levelClear();
  }

  function finishMinigame(game) {
    var mg = game.minigame;
    var M = CONFIG.minigame;
    game.score += mg.slices * M.scorePerSlice;
    if (mg.won) {
      game.score += M.winBonus;
      game.player.hp = Math.min(CONFIG.player.maxHP, game.player.hp + M.heartsOnWin);
    }
    game.minigame = null;
    game.state = 'running';
    // A moment of grace on re-entry: you were looking at melons, not the path.
    game.player.invuln = Math.max(game.player.invuln, CONFIG.minigame.outroSec);
  }

  function testSegment(game, seg) {
    var i;
    // The barn is checked first: entering it ends the tick.
    for (i = 0; i < seg.entities.length; i++) resolve(game, seg.entities[i], seg);
    for (i = 0; i < seg.dynamic.length; i++) {
      if (seg.dynamic[i].landed) resolve(game, seg.dynamic[i], seg);
    }
  }

  function resolve(game, e, seg) {
    if (e.spent || e.kind === 'scenery' || e.kind === 'npc') return;

    var p = game.player;
    if (!U.overlap1D(Player.left(p), Player.right(p), e.offset - e.halfWidth, e.offset + e.halfWidth)) return;
    if (!U.overlap1D(Player.bottom(p), Player.top(p), e.yBase, e.yBase + e.height)) return;

    var screen = entityScreenPos(seg, e);

    if (e.kind === 'barn') {
      // Not an obstacle: you either run through the doorway or past it.
      if (!e.used) enterMinigame(game, e);
      return;
    }

    if (e.kind === 'pickup') {
      e.spent = true;
      game.combo = Math.min(CONFIG.score.comboMax, game.combo + CONFIG.score.comboStep);
      game.comboTimer = CONFIG.score.comboWindowSec;
      var value = Math.round(e.value * game.combo);
      addScore(game, value, screen.x, screen.y, '+' + value);
      FX.burst(game.fx, screen.x, screen.y, 10, pickupColor(e.type), { spread: 150, size: 3, life: 0.4 });
      Audio.pickup(Math.round((game.combo - 1) / CONFIG.score.comboStep));
      return;
    }

    // obstacle or hazard
    if (!Player.canBeHit(p)) return;
    e.spent = true;
    var hp = Player.takeHit(p);
    game.combo = 1;
    game.comboTimer = 0;
    game.hitFlash = 1;
    game.hitRecover = CONFIG.player.hitRecoverTime;
    FX.burst(game.fx, screen.x, screen.y, 16, '#ffb0a0', { spread: 220, size: 4, life: 0.5 });
    Audio.hit();
    if (hp <= 0) endRun(game);
  }

  function entityScreenPos(seg, e) {
    // seg was projected during the last render; fall back to screen centre if
    // this entity was never on screen (possible on the very first frame).
    var s = seg.p1.screen;
    if (!s || !s.scale) return { x: CONFIG.view.designWidth / 2, y: CONFIG.view.designHeight * 0.7 };
    var unit = CONFIG.view.designWidth / 2;
    return {
      x: s.x + s.scale * e.offset * CONFIG.road.halfWidth * unit,
      y: s.y - (e.yBase + e.height * 0.5) * s.scale * unit
    };
  }

  function pickupColor(type) {
    if (type === 'mushroom') return '#e8756a';
    if (type === 'shrimp') return '#f6a98e';
    return '#b79af0';
  }

  function addScore(game, amount, x, y, label) {
    game.score += amount;
    if (label) FX.text(game.fx, x, y, label, '#ffe9a8', 15);
  }

  /* ========================================================================
   * Level end
   * ====================================================================== */
  function finishLevel(game) {
    game.timeLeft = 0;
    var bonus = CONFIG.score.levelCompleteBonus + game.player.hp * CONFIG.score.hpBonusPerHeart;
    game.score += bonus;
    game.lastResult = {
      level: game.level,
      levelName: game.levelName,
      bonus: bonus,
      hearts: game.player.hp,
      distance: Math.round(game.distanceMeters)
    };
    game.state = game.level >= CONFIG.level.count ? 'victory' : 'levelComplete';
    game.bestScore = Math.max(game.bestScore, game.score);
    Audio.levelClear();
  }

  function endRun(game) {
    game.state = 'gameOver';
    game.lastResult = {
      level: game.level,
      levelName: game.levelName,
      bonus: 0,
      hearts: 0,
      distance: Math.round(game.distanceMeters)
    };
    game.bestScore = Math.max(game.bestScore, game.score);
    Audio.gameOver();
  }

  FA.Game = Game;
  FA.LEVEL_NAMES = LEVEL_NAMES;
})(window.FA = window.FA || {});

      var h = px * 0.92, w = h * ar;
      if (w > px) { w = px; h = w / ar; }
      FA.Assets.draw(g, key, 0, px / 2, px * 0.96, w, h);
    }
    return c;
  }

  function legendRow(host, key, name, hint, points) {
    var row = document.createElement('div');
    row.className = 'legend-row';
    row.appendChild(spriteThumb(key, 40));
    var text = document.createElement('div');
    text.className = 'legend-text';
    var n = document.createElement('b');
    n.textContent = name;
    var h = document.createElement('span');
    h.textContent = hint;
    text.appendChild(n);
    text.appendChild(h);
    row.appendChild(text);
    if (points) {
      var p = document.createElement('em');
      p.className = 'legend-points';
      p.textContent = points;
      row.appendChild(p);
    }
    host.appendChild(row);
  }

  function legendSection(host, title) {
    var h = document.createElement('p');
    h.className = 'legend-head';
    h.textContent = title;
    host.appendChild(h);
  }

  /**
   * Built from CONFIG at render time rather than hand-written, so it cannot
   * drift: retune a score or change how an obstacle is avoided and the guide
   * updates itself.
   */
  function renderLegend(host, copy) {
    host.innerHTML = '';
    if (!copy.legend) return;
    var names = FA.STR.itemNames;
    var k;

    legendSection(host, FA.STR.legendPrizes);
    for (k in CONFIG.pickups) {
      legendRow(host, CONFIG.pickups[k].sprite, names[k] || k, '',
                FA.t('points', { n: CONFIG.score.pickup[k] }));
    }

    legendSection(host, FA.STR.legendObstacles);
    for (k in CONFIG.obstacles) {
      legendRow(host, CONFIG.obstacles[k].sprite, names[k] || k,
                FA.STR[HINTS[CONFIG.obstacles[k].avoid]] || '', '');
    }

    legendSection(host, FA.STR.legendHazards);
    for (k in CONFIG.hazards) {
      legendRow(host, CONFIG.hazards[k].sprite, names[k] || k,
                FA.STR[HINTS[CONFIG.hazards[k].avoid]] || '', '');
    }

    legendSection(host, FA.STR.legendAnimals);
    for (k in CONFIG.npc.types) {
      legendRow(host, CONFIG.npc.types[k].sprite, names[k] || k, FA.STR.hintTap,
                FA.t('points', { n: CONFIG.score.npcDeactivated }));
    }

    legendSection(host, FA.STR.legendBarn);
    legendRow(host, 'barn', names.barn, FA.STR.hintBarn, '');
  }

  function showOverlay(state) {
    var build = OVERLAY_COPY[state];
    if (!build) { overlay.classList.add('hidden'); return; }
    var copy = build();

    overlay.querySelector('#ov-eyebrow').textContent = copy.eyebrow || '';
    overlay.querySelector('#ov-title').textContent = copy.title;
    overlay.querySelector('#ov-body').textContent = copy.body || '';

    var statsEl = overlay.querySelector('#ov-stats');
    statsEl.innerHTML = '';
    (copy.stats || []).forEach(function (row) {
      var d = document.createElement('div');
      d.className = 'stat';
      d.innerHTML = '<span>' + row[0] + '</span><b>' + row[1] + '</b>';
      statsEl.appendChild(d);
    });

    renderPhoto(overlay.querySelector('#ov-photo'), copy);
    renderLegend(overlay.querySelector('#ov-legend'), copy);
    renderSubmit(overlay.querySelector('#ov-submit'), copy);
    renderBoard(overlay.querySelector('#ov-board'), copy);

    var actionsEl = overlay.querySelector('#ov-actions');
    actionsEl.innerHTML = '';
    copy.actions.forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (a.primary ? ' btn-primary' : '');
      b.textContent = a.label;
      b.addEventListener('click', function () {
        FA.Audio.unlock();
        FA.Input.clear();
        a.act();
        syncOverlay(true);
      });
      actionsEl.appendChild(b);
    });

    overlay.classList.toggle('celebrate', !!copy.celebrate);
    overlay.classList.remove('hidden');
  }

  function syncOverlay(force) {
    if (!force && game.state === lastRenderedState) return;
    var entering = game.state !== lastRenderedState;
    lastRenderedState = game.state;

    if (entering && (game.state === 'gameOver' || game.state === 'victory')) {
      FA.Scores.noteRun(game.score);
      game.bestScore = Math.max(game.bestScore, FA.Scores.localBest());
    }
    if (entering && game.state === 'intro' && game.level === 1) submittedThisRun = false;
    if (game.state === 'running' || game.state === 'intro') overlay.classList.add('hidden');
    else showOverlay(game.state);
    // Pause and mute only make sense while a run is live.
    document.getElementById('system-buttons').style.display =
      (game.state === 'running' || game.state === 'intro' || game.state === 'paused') ? 'flex' : 'none';
  }

  /* ----------------------------------------------------------- touch buttons */
  function setupTouchButtons() {
    var wanted = CONFIG.input.showTouchButtons;
    var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var show = wanted === true || (wanted === 'auto' && isTouch);
    var pad = document.getElementById('touch-controls');
    if (!show) { pad.style.display = 'none'; return; }

    Array.prototype.forEach.call(pad.querySelectorAll('[data-action]'), function (el) {
      var action = el.getAttribute('data-action');
      // pointerdown, not click: a runner needs the input on press, not release.
      el.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        el.classList.add('pressed');
        FA.Audio.unlock();
        FA.Input.emit(action);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (evt) {
        el.addEventListener(evt, function () { el.classList.remove('pressed'); });
      });
    });
  }

  function setupSystemButtons() {
    document.getElementById('btn-pause').addEventListener('click', function () {
      FA.Game.togglePause(game);
      syncOverlay(true);
    });
    var muteBtn = document.getElementById('btn-mute');
    muteBtn.addEventListener('click', function () {
      var muted = FA.Audio.toggleMute();
      muteBtn.classList.toggle('off', muted);
      muteBtn.setAttribute('aria-label', muted ? FA.STR.a11yUnmute : FA.STR.a11yMute);
    });
  }

  /* ---------------------------------------------------------------- the loop */
  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);

    var deltaMs = Math.min(now - last, CONFIG.view.maxDeltaMs);
    last = now;
    var dt = deltaMs / 1000;
    game.fps = U.damp(game.fps, dt > 0 ? 1 / dt : 60, 4, dt);

    var step = CONFIG.view.fixedStep;
    accumulator += dt;
    var steps = 0;
    while (accumulator >= step && steps < CONFIG.view.maxSubSteps) {
      FA.Game.update(game, step);
      accumulator -= step;
      steps++;
    }
    // Too far behind to catch up honestly: drop the backlog rather than
    // fast-forwarding the cat into whatever is waiting downrange.
    if (steps === CONFIG.view.maxSubSteps) accumulator = 0;

    if (game.state === 'minigame') {
      FA.Minigame.render(ctx, game);
    } else if (game.track) {
      FA.Renderer.render(ctx, game);
      FA.HUD.render(ctx, game);
    }

    // The celebration runs outside the simulation, which is frozen by now.
    if (game.state === 'victory') {
      if (!fireworks) {
        fireworks = FA.Fireworks.create();
        for (var b = 0; b < 3; b++) FA.Fireworks.launch(fireworks);   // open loud
      }
      FA.Fireworks.update(fireworks, dt);
      FA.Fireworks.render(ctx, fireworks);
    } else if (fireworks) {
      fireworks = null;
    }
    // The gesture layer switches meaning with the game state: verbs on the
    // path, blade strokes in the barn.
    var wantSlice = game.state === 'minigame';
    if (wantSlice !== sliceModeOn) {
      sliceModeOn = wantSlice;
      FA.Input.setSliceMode(wantSlice);
    }
    syncOverlay(false);
  }

  /* ------------------------------------------------------------------- start */
  function boot() {
    canvas = document.getElementById('game');
    stage = document.getElementById('stage');
    overlay = document.getElementById('overlay');

    setupCanvas();
    fitStage();
    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', fitStage);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitStage);

    game = FA.Game.create();
    FA.Scores.init();
    game.bestScore = FA.Scores.localBest();

    FA.Input.init(canvas, {
      action: function (kind) {
        FA.Audio.unlock();
        FA.Game.action(game, kind);
      },
      tap: function (x, y) { return FA.Game.tap(game, x, y); },
      slice: function (x0, y0, x1, y1) {
        if (game.state !== 'minigame') return;
        FA.Minigame.trail(game.minigame, x1, y1);
        FA.Minigame.slice(game.minigame, x0, y0, x1, y1);
      },
      pause: function () {
        FA.Game.togglePause(game);
        syncOverlay(true);
      }
    });

    document.title = FA.STR.gameTitle;
    var loadingEl = document.getElementById('loading');
    if (loadingEl) loadingEl.textContent = FA.STR.loading;
    var A11Y = { left: FA.STR.a11yLeft, right: FA.STR.a11yRight,
                 jump: FA.STR.a11yJump, slide: FA.STR.a11ySlide };
    Array.prototype.forEach.call(document.querySelectorAll('[data-action]'), function (b) {
      b.setAttribute('aria-label', A11Y[b.getAttribute('data-action')] || '');
    });
    document.getElementById('btn-pause').setAttribute('aria-label', FA.STR.a11yPause);
    document.getElementById('btn-mute').setAttribute('aria-label', FA.STR.a11yMute);

    setupTouchButtons();
    setupSystemButtons();

    // Losing focus mid-run should never cost a life.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { FA.Game.pause(game); syncOverlay(true); }
    });
    window.addEventListener('blur', function () { FA.Game.pause(game); syncOverlay(true); });

    FA.Assets.load(function () {
      FA.Renderer.init(ctx);
      // Build a track immediately so the title screen has a forest behind it.
      FA.Game.startLevel(game, 1);
      game.state = 'title';
      document.getElementById('loading').classList.add('hidden');
      syncOverlay(true);

      running = true;
      last = performance.now();
      requestAnimationFrame(frame);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  // Exposed for tinkering from the console: FA.debug.game.score = 9999
  FA.debug = { get game() { return game; } };
})(window.FA = window.FA || {});

</script>
</body>
</html>
